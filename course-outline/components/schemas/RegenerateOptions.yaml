# Generated by build/split-spec.mjs from the bundled contract.
# Edit this file directly - it is source. Run `npm run build` to re-bundle.
type: object
required:
  - previousOutlineId
properties:
  previousOutlineId:
    type: string
    format: uuid
    description: "`outlineId` of the result being regenerated."
  preserveEditedNodes:
    type: boolean
    default: true
    description: |
      Backs the 1c copy *"Regenerating keeps your manual edits."* When true, nodes listed in
      `lockedLogicalIds` are echoed back verbatim — same `logicalId`, same title, same outcomes — and
      the AI regenerates only around them.
  lockedLogicalIds:
    type: array
    items:
      type: string
      format: uuid
    default: []
    description: |
      `logicalId`s the teacher hand-edited. **The consumer computes this set** — the AI service does
      not track edit history.
  scope:
    oneOf:
      - $ref: ./RegenerateScope.yaml
      - type: "null"
    default: null
    description: |
      Limits regeneration to one subtree — this is what the per-row generate actions target. `null`
      regenerates the whole outline.

      When scoped, `result.module[]` still returns the **complete** tree, with untouched nodes echoed
      back unchanged, so the consumer always persists one consistent document.
