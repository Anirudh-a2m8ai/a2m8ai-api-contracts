# Generated by build/split-spec.mjs from the bundled contract.
# Edit this file directly - it is source. Run `npm run build` to re-bundle.
post:
  operationId: generateCourseOutline
  tags:
    - course-creation
  summary: Queue an outline generation job
  description: |
    Generates a full **Module → Chapter → Lesson → Topic → SubTopic** curriculum outline with learning
    outcomes, from course metadata plus previously ingested course materials.

    Long-running, so it is modelled as an async job: this endpoint queues the work and returns a `jobId`
    immediately. Poll `GET /api/v1/course-creation/outline/jobs/{jobId}` for the result.

    ### Scope

    This contract produces **structure and learning outcomes only**.

    - SubTopic *content* (explanation, examples, figure) is generated separately — see the
      **course-content** tag, which backs screens 1d and 1e and takes the `learningOutcomes` produced
      here as its input. SubTopics come back as `contentStatus: PENDING`.
    - **Assignments are not produced here.** The graded/ungraded assignment rows in 1c render as
      "Not built yet" placeholders and are built via screens 1m → 1j/1i.

    ### Persisting the result

    The `module[]` subtree is deliberately shaped as a near drop-in payload for the LMS backend's existing
    `CreateLessonPlanDto` (`src/api/course/dto/lessonPlan.dto.ts`) — same singular key names
    (`module`, `chapter`, `lesson`, `topic`, `subTopic`) and same field names — so the backend can persist
    via `POST /course/lesson-plan` without a translation layer. Only `logicalId`, `orderIndex`,
    `learningOutcomes`, `sourceRefs` and `contentStatus` are additions.
  x-design-refs:
    - screen: 1a
      title: Course setup — metadata + materials
      usedFor: Source of the course.* request fields and the documentIds that materials resolve to.
    - screen: 1b
      title: Build mode selection
      usedFor: Entry point. "Generate content with AI" submits this job. Copy promises "Outline in ~30s" and "Learning outcomes included".
    - screen: 1c
      title: AI outline review
      usedFor: Renders the entire response — tree, learning outcome bullets, Outline summary panel, Sources used panel.
  x-timeout-ms: 10000
  parameters:
    - $ref: ../../shared/components/parameters/TenantId.yaml
    - $ref: ../../shared/components/parameters/RequestId.yaml
    - $ref: ../../shared/components/parameters/IdempotencyKey.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/GenerateOutlineRequest.yaml
        examples:
          typical:
            summary: What screen 1b sends today
            description: 1b exposes no generation controls, so only the required fields plus light academic steering are sent. Everything under `generation` falls back to service defaults.
            value:
              courseId: 3f7c2a10-9b41-4c8e-a2d5-6e1f0b3c7d84
              courseVersionId: 8c1e5d92-47b3-4a6f-9e02-1d5a8f4b6c37
              course:
                title: Data Structures & Algorithms
                courseCode: CS301
                description: "Core data structures and algorithm design: arrays, linked lists, trees, graphs, sorting and complexity analysis with weekly labs."
                type: CLASSROOM
                versionName: v1
                designation:
                  id: b7a3f012-5c84-4e91-8d26-3f0a9b1c7e45
                  title: B.Tech CSE - Semester 3
              documentIds:
                - d1a4b830-2e75-4f19-b6c3-8a2d5e9f0147
                - e2b5c941-3f86-4a2b-c7d4-9b3e6f0a1258
                - f3c6da52-4097-4b3c-d8e5-0c4f7a1b2369
              generation:
                academic:
                  durationWeeks: 14
                  difficultyLevel: INTERMEDIATE
                  bloomsLevels:
                    - UNDERSTAND
                    - APPLY
                    - ANALYZE
                  prerequisiteKnowledge: Programming fundamentals in C or Java
                sourceFidelity:
                  followSourceOrder: true
                  strictSourceGrounding: false
              regenerate: null
          minimal:
            summary: Smallest valid request
            description: Only the required fields. All generation behaviour is service-default.
            value:
              courseId: 3f7c2a10-9b41-4c8e-a2d5-6e1f0b3c7d84
              courseVersionId: 8c1e5d92-47b3-4a6f-9e02-1d5a8f4b6c37
              course:
                title: Data Structures & Algorithms
                type: CLASSROOM
              documentIds:
                - d1a4b830-2e75-4f19-b6c3-8a2d5e9f0147
          regenerate:
            summary: Regenerating, preserving manual edits
            description: Backs the "Regenerate outline" button in 1c. Nodes the teacher hand-edited are listed in `lockedLogicalIds` and are echoed back verbatim. A `scope` limits regeneration to one subtree — this is what the per-row generate actions target.
            value:
              courseId: 3f7c2a10-9b41-4c8e-a2d5-6e1f0b3c7d84
              courseVersionId: 8c1e5d92-47b3-4a6f-9e02-1d5a8f4b6c37
              course:
                title: Data Structures & Algorithms
                type: CLASSROOM
              documentIds:
                - d1a4b830-2e75-4f19-b6c3-8a2d5e9f0147
              regenerate:
                previousOutlineId: c4d8e0f2-1a35-4b79-8c6d-2e5f9a0b3c17
                preserveEditedNodes: true
                lockedLogicalIds:
                  - 11111111-1111-4111-8111-111111111111
                scope:
                  level: MODULE
                  logicalId: 11111111-1111-4111-8111-111111111111
  responses:
    "202":
      description: |
        Job queued.

        Also returned for a repeat submit carrying a known `Idempotency-Key`, in which case `jobId`
        is the **original** job — no second, billable generation is started.
      headers:
        x-request-id:
          $ref: ../../shared/components/headers/XRequestId.yaml
      content:
        application/json:
          schema:
            $ref: ../../shared/components/schemas/JobAcceptedResponse.yaml
          example:
            statusCode: 202
            code: LMS202
            success: true
            message: Outline generation job queued.
            data:
              jobId: a91f3c7d-6b28-4e50-9a13-7c4f8b2e0d65
              status: QUEUED
              estimatedSeconds: 30
              pollUrl: /api/v1/course-creation/outline/jobs/a91f3c7d-6b28-4e50-9a13-7c4f8b2e0d65
              pollAfterMs: 3000
              expiresAt: 2026-08-18T10:35:00.000Z
              createdAt: 2026-08-18T10:30:00.000Z
            meta: null
            error: null
