post:
  operationId: cancelOutlineJob
  tags:
    - course-creation
  summary: Cancel a queued or running job
  description: |
    Screen 1b → 1c is a ~30 s wait the teacher can back out of. Cancelling stops billable generation
    instead of orphaning the job.

    Cancelling an already-terminal job is a `409`, not a no-op — the consumer should know its cancel
    arrived too late.
  parameters:
    - $ref: ../../shared/components/parameters/JobId.yaml
    - $ref: ../../shared/components/parameters/TenantId.yaml
    - $ref: ../../shared/components/parameters/RequestId.yaml
  responses:
    "200":
      description: Job cancelled.
      headers:
        x-request-id:
          $ref: ../../shared/components/headers/XRequestId.yaml
      content:
        application/json:
          schema:
            $ref: ../../shared/components/schemas/CancelResponse.yaml
          example:
            statusCode: 200
            code: LMS200
            success: true
            message: Job cancelled.
            data:
              jobId: a91f3c7d-6b28-4e50-9a13-7c4f8b2e0d65
              status: CANCELLED
              cancelledAt: 2026-08-18T10:30:20.000Z
            meta: null
            error: null
    "401":
      $ref: ../../shared/components/responses/Unauthorized.yaml
    "404":
      $ref: ../../shared/components/responses/JobNotFound.yaml
    "409":
      $ref: ../../shared/components/responses/JobAlreadyTerminal.yaml
