get:
  operationId: getOutlineJob
  tags:
    - course-creation
  summary: Poll a generation job
  description: |
    Returns the current state of a generation job, and the outline itself once the job succeeds.

    ### Polling

    Honour `data.pollAfterMs` from each response rather than a fixed interval. Suggested consumer
    backoff: 3 s for the first 30 s, then 5 s, giving up at the job's `expiresAt`.

    ### Failure handling

    This endpoint returns **`200` for every job state, including `FAILED`** — the transport succeeded,
    the job did not. Inspect `data.status`; when it is `FAILED`, `data.error` carries the same
    `ErrorDetail` shape (`name`/`details`/`fieldErrors`) as a transport-level error's `error` object.
    Non-2xx from this endpoint means the *request* was bad (bad key, unknown job), never that
    generation failed.

    Terminal jobs (`SUCCEEDED`, `FAILED`, `CANCELLED`) are retained for 1 hour after completion, then
    return `404 JOB_NOT_FOUND`.
  x-timeout-ms: 15000
  parameters:
    - $ref: ../../shared/components/parameters/JobId.yaml
    - $ref: ../../shared/components/parameters/TenantId.yaml
    - $ref: ../../shared/components/parameters/RequestId.yaml
  responses:
    "200":
      description: Current job state. See `data.status`.
      headers:
