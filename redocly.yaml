apis:
  course-outline:
    root: course-outline/openapi.yaml
  content-generation:
    root: content-generation/openapi.yaml

extends:
  - recommended

rules:
  # Internal service, not distributed — a license block would be noise.
  info-license: off

  # SuccessEnvelope requires `data` without declaring it: every operation
  # supplies its own `data` shape through allOf (see README, "Response
  # envelopes"). Since the split, each schema is also linted as its own file,
  # where that allOf sibling is not in view — so the rule fires on the base
  # envelope every time. The pattern is deliberate, so the rule is not useful
  # for this contract.
  no-required-schema-properties-undefined: off

  # Enforce the conventions in README.md.
  operation-operationId: error
  operation-summary: error
  operation-description: error
  operation-4xx-response: error
  tag-description: error
  no-ambiguous-paths: error
  no-identical-paths: error
  path-declaration-must-exist: error
  security-defined: error

openapi:
  theme:
    colors:
      primary:
        main: "#4f46e5"
  hideDownloadButton: false
  expandResponses: "200,202"
  jsonSampleExpandLevel: 3
  pathInMiddlePanel: true
  requiredPropsFirst: true
  sortTagsAlphabetically: false
