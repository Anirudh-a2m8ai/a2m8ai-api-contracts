                value:
                  courseId: 3f7c2a10-9b41-4c8e-a2d5-6e1f0b3c7d84
                  courseVersionId: 8c1e5d92-47b3-4a6f-9e02-1d5a8f4b6c37
                  course:
                    title: Data Structures & Algorithms
