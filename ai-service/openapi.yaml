  /api/v1/course-creation/outline/jobs/{jobId}/cancel:
    post:
      operationId: cancelOutlineJob
      tags: [course-creation]
      summary: Cancel a queued or running job
      description: |
        Screen 1b → 1c is a ~30 s wait the teacher can back out of. Cancelling stops billable generation
        instead of orphaning the job.

        Cancelling an already-terminal job is a `409`, not a no-op — the consumer should know its cancel
        arrived too late.
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Job cancelled.
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelResponse"
              example:
                status: success
                statusCode: 200
                data:
                  jobId: a91f3c7d-6b28-4e50-9a13-7c4f8b2e0d65
                  status: CANCELLED
                  cancelledAt: "2026-08-18T10:30:20.000Z"
                timestamp: "2026-08-18T10:30:20.000Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/JobNotFound" }
        "409": { $ref: "#/components/responses/JobAlreadyTerminal" }

  /api/v1/course-creation/content/generate:
    post:
      operationId: generateSubTopicContent
      tags: [course-content]
      summary: Queue a subtopic content generation job
      description: |
        Writes the teaching content for a batch of SubTopics: an **explanation** in markdown, a set of
        **examples**, and one **illustration**, plus **teacher notes** and **common misconceptions**.

        Long-running, so it is modelled as an async job like the outline. Poll
        `GET /api/v1/course-creation/content/jobs/{jobId}`.

        ### Learning outcomes are the input, not a side note

        Every target carries its `ancestry` — the module, chapter and lesson it sits under, **with the
        `learningOutcomes` the outline generated for each**. Those outcomes are the primary steering
        signal: each generated block must serve at least one of them, nearest level first
        (lesson → chapter → module). The result reports back which outcomes it actually covered in
        `content.outcomeCoverage`, so grounding is auditable rather than assumed.

        A target whose ancestry carries no outcomes at any level is generated on titles alone and
        raises an `OUTCOME_NOT_COVERED` warning.

        ### Stateless

        The AI service holds no outline. Whatever the generation must be aware of travels in the
        request — this is why `ancestry` repeats per target instead of being sent once as a tree. It
        keeps every target independently processable and survives the outline job's 1-hour retention
        window expiring.

        ### Batching

        One job covers 1–50 subtopics. Screen 1d submits the whole course (28 in the design mock);
        screen 1c's per-row action and 1e's regenerate submit exactly one. Partial failure is normal
        and expressible — see the poll endpoint.

        ### Persisting the result

        `content`, `examples` and `image` are named to match the `SubTopics` Prisma columns and the
        existing `POST /sub-topic` / `PATCH /sub-topic` DTOs field-for-field, so a finished item
        persists without a translation layer. `teacherAids` is the one part with nowhere to go today —
        see `x-dependencies`.
      x-design-refs:
        - screen: "1c"
          title: AI outline review
          usedFor: >-
            The per-row Generate action on a SubTopic row submits a single-target job. Row badges read
            from `contentStatus`.
        - screen: "1d"
          title: Bulk content generation
          usedFor: >-
            Entry point for the whole course. Copy promises "Each subtopic gets an explanation, worked
            examples and a suggested diagram."
        - screen: "1e"
          title: SubTopic workbench
          usedFor: >-
            The ✦ AI toolkit submits single-target jobs carrying `regenerate` — the quick-action chips
            map to `regenerate.quickAction`, the prompt box to `regenerate.instruction`.
      x-timeout-ms: 10000
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateContentRequest"
            examples:
              typical:
                summary: What screen 1d sends
                description: >-
                  Three subtopics from one topic, abridged from the 28 the design mock generates. Each
                  target repeats its ancestry so it can be generated independently. `generation` is
                  omitted entirely — 1d exposes no controls, so every option falls back to its default,
                  which means teacher notes and common misconceptions only.
                value:
                  courseId: 3f7c2a10-9b41-4c8e-a2d5-6e1f0b3c7d84
                  courseVersionId: 8c1e5d92-47b3-4a6f-9e02-1d5a8f4b6c37
                  outlineId: c4d8e0f2-1a35-4b79-8c6d-2e5f9a0b3c17
                  course:
                    title: Data Structures & Algorithms
                    courseCode: CS301
                    type: CLASSROOM
                    designation:
                      id: b7a3f012-5c84-4e91-8d26-3f0a9b1c7e45
                      title: B.Tech CSE - Semester 3
                  documentIds:
                    - d1a4b830-2e75-4f19-b6c3-8a2d5e9f0147
                    - e2b5c941-3f86-4a2b-c7d4-9b3e6f0a1258
                  targets:
                    - subTopicLogicalId: 55555555-5555-4555-8555-555555555551
                      title: Insertion & deletion
                      orderIndex: 0
                      isMandatory: true
                      ancestry: &arrayOpsAncestry
                        module:
                          logicalId: 11111111-1111-4111-8111-111111111111
                          title: Foundations of Data Structures
                          learningOutcomes:
                            - Reason about arrays and memory layout to predict access cost and cache behaviour
                        chapter:
                          logicalId: 22222222-2222-4222-8222-222222222222
                          title: Arrays & Memory Layout
                          learningOutcomes:
                            - Implement static and dynamic arrays, including resizing and growth strategies
                        lesson:
                          logicalId: 33333333-3333-4333-8333-333333333333
                          title: Static & Dynamic Arrays
                          learningOutcomes:
                            - Perform and analyse core array operations - insert, delete, traverse and resize
                            - Explain how arrays map onto contiguous memory and why it drives performance
                        topic:
                          logicalId: 44444444-4444-4444-8444-444444444444
                          title: Array Operations
                          description: Reads, writes and growth behaviour
                      sourceRefs:
                        - documentId: d1a4b830-2e75-4f19-b6c3-8a2d5e9f0147
                          locator: pp. 1-4
                    - subTopicLogicalId: 55555555-5555-4555-8555-555555555552
                      title: Traversal & search
