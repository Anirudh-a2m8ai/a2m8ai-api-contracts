                                  title: Code · insert at index
                                  language: python
                                  code: |-
                                    def insert(self, i, x):
                                        for j in range(self.size, i, -1):
                                            self.data[j] = self.data[j - 1]   # shift right
                                        self.data[i] = x
                                        self.size += 1
                                  explanation: >-
                                    The loop runs backwards. Going forwards would overwrite each element
                                    before it had been copied.
                                  output: null
                                  question: null
                                  steps: []
                                  answer: null
                                  difficulty: EASY
