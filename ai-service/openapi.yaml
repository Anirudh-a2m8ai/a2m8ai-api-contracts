        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/JobNotFound" }

  /api/v1/course-creation/content/jobs/{jobId}/cancel:
    post:
      operationId: cancelContentJob
      tags: [course-content]
      summary: Stop a content generation job, keeping finished subtopics
      description: |
        Backs the **Pause generation** button in 1d.

        ### Finished work is kept

        Cancelling stops the subtopics that have not started and abandons any mid-flight, but every item
        already `READY` **stays in the terminal job's `result`** — the teacher does not lose content
        that was already paid for and already openable in the workbench. Remaining items settle to
        `CANCELLED`, and `result.summary.cancelled` counts them.

        Poll once more after cancelling to collect that final result; the job is retained for the usual
        1 hour.

        ### Not a pause

        The design copy says *Pause*, but this contract offers no resume — a cancelled job is terminal.
        To finish the rest, submit a new job carrying only the `CANCELLED` targets. See
        `x-dependencies.content-job-pause`.

        Cancelling an already-terminal job is a `409`, not a no-op.
      x-design-refs:
        - screen: "1d"
          title: Bulk content generation
          usedFor: The "Pause generation" button on all three breakpoints.
      x-timeout-ms: 10000
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: |
            Job cancelled. Poll once more to collect the partial result — subtopics already `READY`
            are still there.
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelResponse"
              example:
                status: success
                statusCode: 200
                data:
                  jobId: b82e4d6c-7a19-4f31-8b52-9d3e0c1f7a48
                  status: CANCELLED
                  cancelledAt: "2026-08-18T10:47:10.000Z"
                timestamp: "2026-08-18T10:47:10.000Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/JobNotFound" }
        "409": { $ref: "#/components/responses/JobAlreadyTerminal" }

components:

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: |
        Shared server-to-server secret. The LMS backend holds it; it is **never** exposed to the browser.
        Mirrors the existing `ApiKeyGuard` convention in college-lms-backend
        (`src/common/guards/api.guard.ts`).

  parameters:
    TenantId:
      name: x-tenant-id
      in: header
      required: true
      description: |
        Tenant the course belongs to. Enforces multi-tenant isolation on `documentIds` and `jobId`s, and
        scopes usage quotas. A `jobId` or `documentId` belonging to another tenant resolves as **404, never
        403**, so ids cannot be probed.
      schema:
        type: string
        format: uuid

    RequestId:
      name: x-request-id
      in: header
      required: true
      description: Correlation id, echoed into AI service logs so a request can be traced across LMS and AI logs.
      schema:
        type: string
        format: uuid

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Guards against duplicate generation on backend retry. A repeat submit with the same key within the
        retention window returns the **existing** job (`202` with the original `jobId`) instead of starting a
        second, billable generation. The key is scoped to the tenant and retained for **24 hours**.
      schema:
        type: string
        format: uuid

    JobId:
      name: jobId
      in: path
      required: true
      description: Job identifier returned by the submit endpoint.
      schema:
        type: string
        format: uuid

  headers:
    XRequestId:
      description: Echo of the inbound correlation id.
      schema:
        type: string
        format: uuid
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1

  responses:
    BadRequest:
      description: "`INVALID_REQUEST` — schema or validation failure."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            status: failed
            statusCode: 400
            error: ApplicationError
            errorCode: INVALID_REQUEST
            message: Validation failed.
            details:
              fieldErrors:
                - path: documentIds
                  message: must contain at least 1 item
                - path: generation.structure.targetModuleCount
                  message: max must be greater than or equal to min
            timestamp: "2026-08-18T10:30:00.000Z"

    Unauthorized:
      description: "`INVALID_API_KEY` — `x-api-key` missing or wrong."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            status: failed
            statusCode: 401
            error: ApplicationError
            errorCode: INVALID_API_KEY
            message: API key is required.
            details: null
            timestamp: "2026-08-18T10:30:00.000Z"

    DocumentNotFound:
      description: |
        `DOCUMENT_NOT_FOUND` — a `documentId` is unknown, or belongs to another tenant.
        Cross-tenant ids resolve as 404, never 403, so ids cannot be probed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            status: failed
            statusCode: 404
            error: ApplicationError
            errorCode: DOCUMENT_NOT_FOUND
            message: One or more course materials could not be found.
            details:
              documentIds: [f3c6da52-4097-4b3c-d8e5-0c4f7a1b2369]
            timestamp: "2026-08-18T10:30:00.000Z"

    JobNotFound:
      description: |
        `JOB_NOT_FOUND` — unknown `jobId`, a job from another tenant, or a terminal job past its
        1-hour retention window.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            status: failed
            statusCode: 404
            error: ApplicationError
            errorCode: JOB_NOT_FOUND
            message: Generation job not found.
            details: null
            timestamp: "2026-08-18T10:30:00.000Z"

    ContentNotFound:
      description: |
        `CONTENT_NOT_FOUND` — `regenerate.previousContentId` is unknown, belongs to another tenant, or
        has passed its retention window. Cross-tenant ids resolve as 404, never 403.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            status: failed
            statusCode: 404
            error: ApplicationError
            errorCode: CONTENT_NOT_FOUND
            message: The content being regenerated could not be found. Generate it again from scratch.
            details:
              previousContentId: 9e2a7c50-4d81-4b36-a07f-5c1e9b3d8f24
            timestamp: "2026-08-18T10:30:00.000Z"

    JobAlreadyTerminal:
      description: "`JOB_ALREADY_TERMINAL` — cancel called on a job already SUCCEEDED, FAILED or CANCELLED."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            status: failed
            statusCode: 409
            error: ApplicationError
            errorCode: JOB_ALREADY_TERMINAL
            message: This job has already finished and cannot be cancelled.
            details:
              status: SUCCEEDED
            timestamp: "2026-08-18T10:30:00.000Z"

    UnprocessableSource:
      description: |
        The request is well-formed but the source material cannot be used.

        - `DOCUMENT_NOT_PROCESSED` — a document is still `UPLOADING`/`PARSING`, or its parse `FAILED`.
          Surfaces screen 1a's copy: *"Legacy-Notes.epub couldn't be parsed — re-export as PDF or retry."*
          Retryable once ingest finishes.
        - `INSUFFICIENT_SOURCE_MATERIAL` — parsed text is too thin to build a credible outline. Much more
          likely when `strictSourceGrounding` is true. Not retryable without better material.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            documentNotProcessed:
              summary: DOCUMENT_NOT_PROCESSED
              value:
                status: failed
                statusCode: 422
                error: ApplicationError
                errorCode: DOCUMENT_NOT_PROCESSED
                message: Legacy-Notes.epub has not finished parsing.
                details:
                  documents:
                    - documentId: f3c6da52-4097-4b3c-d8e5-0c4f7a1b2369
                      fileName: Legacy-Notes.epub
                      status: FAILED
                timestamp: "2026-08-18T10:30:00.000Z"
            insufficientMaterial:
              summary: INSUFFICIENT_SOURCE_MATERIAL
              value:
                status: failed
                statusCode: 422
                error: ApplicationError
                errorCode: INSUFFICIENT_SOURCE_MATERIAL
                message: The uploaded materials do not contain enough content to build an outline.
                details:
                  extractedCharacters: 412
                  minimumRequired: 2000
                timestamp: "2026-08-18T10:30:00.000Z"

    RateLimited:
      description: |
        - `RATE_LIMITED` — too many concurrent jobs for this tenant. Retryable.
        - `QUOTA_EXCEEDED` — tenant generation quota exhausted for the billing period. Not retryable.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            rateLimited:
              summary: RATE_LIMITED
              value:
                status: failed
                statusCode: 429
                error: ApplicationError
                errorCode: RATE_LIMITED
                message: Too many generation jobs in progress. Please retry shortly.
                details:
                  concurrentJobs: 5
                  limit: 5
                timestamp: "2026-08-18T10:30:00.000Z"
            quotaExceeded:
              summary: QUOTA_EXCEEDED
              value:
                status: failed
                statusCode: 429
                error: ApplicationError
                errorCode: QUOTA_EXCEEDED
                message: Your AI generation quota for this period has been used up.
                details:
                  used: 500
                  limit: 500
                timestamp: "2026-08-18T10:30:00.000Z"

    ServiceUnavailable:
      description: "`SERVICE_UNAVAILABLE` — AI service draining or a dependency is down. Retryable."
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            status: failed
            statusCode: 503
            error: ApplicationError
            errorCode: SERVICE_UNAVAILABLE
            message: The AI service is temporarily unavailable.
            details: null
            timestamp: "2026-08-18T10:30:00.000Z"

  schemas:

    # ---------- envelopes ----------

    SuccessEnvelope:
      type: object
      description: Common wrapper on every 2xx response.
      required: [status, statusCode, data, timestamp]
      properties:
        status:
          type: string
          const: success
        statusCode:
          type: integer
          examples: [200]
        timestamp:
          type: string
          format: date-time
          description: ISO-8601 with milliseconds, UTC.

    ErrorResponse:
      type: object
      description: |
        Common wrapper on every non-2xx response. Mirrors the LMS backend's `GlobalExceptionFilter`
        (`src/common/filters/global-exception.filter.ts`) with `errorCode` added, so consumers branch on a
        stable code rather than matching message strings.
      required: [status, statusCode, error, errorCode, message, timestamp]
      properties:
        status:
          type: string
          const: failed
        statusCode:
          type: integer
        error:
          type: string
          const: ApplicationError
        errorCode:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          description: Human-readable and always safe to render directly in the UI.
        details:
          type: [object, "null"]
          additionalProperties: true
          description: Error-specific context. Shape varies by `errorCode` — see each response's example.
        timestamp:
          type: string
          format: date-time

    ErrorCode:
      type: string
      description: |
        Stable machine-readable failure code.

        | Code | HTTP | Retryable |
        |---|---|---|
        | `INVALID_REQUEST` | 400 | no |
        | `INVALID_API_KEY` | 401 | no |
        | `DOCUMENT_NOT_FOUND` | 404 | no |
        | `JOB_NOT_FOUND` | 404 | no |
        | `CONTENT_NOT_FOUND` | 404 | no |
        | `JOB_ALREADY_TERMINAL` | 409 | no |
        | `DOCUMENT_NOT_PROCESSED` | 422 | yes — once ingest finishes |
        | `INSUFFICIENT_SOURCE_MATERIAL` | 422 | no |
        | `RATE_LIMITED` | 429 | yes |
        | `QUOTA_EXCEEDED` | 429 | no |
        | `MODEL_ERROR` | job-level | yes |
        | `SERVICE_UNAVAILABLE` | 503 | yes |
        | `GENERATION_TIMEOUT` | job-level | yes |

        `MODEL_ERROR` and `GENERATION_TIMEOUT` surface as terminal **job** errors on the poll endpoint
        (HTTP 200, `data.status: FAILED`), never as a transport status on submit.
      enum:
        - INVALID_REQUEST
        - INVALID_API_KEY
        - DOCUMENT_NOT_FOUND
        - JOB_NOT_FOUND
        - CONTENT_NOT_FOUND
        - JOB_ALREADY_TERMINAL
        - DOCUMENT_NOT_PROCESSED
        - INSUFFICIENT_SOURCE_MATERIAL
        - RATE_LIMITED
        - QUOTA_EXCEEDED
        - MODEL_ERROR
        - SERVICE_UNAVAILABLE
        - GENERATION_TIMEOUT

    # ---------- request ----------

    GenerateOutlineRequest:
      type: object
      required: [courseId, courseVersionId, course, documentIds]
      properties:
        courseId:
          type: string
          format: uuid
          description: "`Course.id` in the LMS. Echoed back for correlation; the AI service does not resolve it."
        courseVersionId:
          type: string
          format: uuid
          description: |
            `CourseVersion.id` the outline will be persisted against. Echoed back in the result so the
            result is a complete persist payload on its own.
        course:
          $ref: "#/components/schemas/CourseMetadata"
        documentIds:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            format: uuid
          description: |
            Ids of course materials already uploaded and parsed by the document ingest API. Every id must be
            in status `PROCESSED` — see `DOCUMENT_NOT_PROCESSED`. This is why screen 1b can say
            *"3 files processed"* before generation starts.

            **Depends on the document ingest contract, which does not exist yet.**
        generation:
          $ref: "#/components/schemas/GenerationOptions"
        regenerate:
          oneOf:
            - $ref: "#/components/schemas/RegenerateOptions"
            - type: "null"
          default: null
          description: |
            Present only when re-running against an existing outline — the "Regenerate outline" button and
            the per-row generate actions in 1c. Absent or `null` means a fresh generation.

    CourseMetadata:
      type: object
      description: |
        Course metadata captured on screen 1a. This is the primary steering signal alongside the documents.
      required: [title, type]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
          examples: [Data Structures & Algorithms]
        courseCode:
          type: string
          maxLength: 32
          examples: [CS301]
        description:
          type: string
          maxLength: 2000
          description: Free-text course description from 1a. Strong signal for scope boundaries.
        type:
          type: string
          enum: [CLASSROOM, SELF_PACED]
          description: |
            Mirrors the `CourseType` Prisma enum. `CLASSROOM` outlines may assume instructor-led pacing and
            cohort activities; `SELF_PACED` outlines should be self-contained and finer-grained.
        versionName:
          type: string
          maxLength: 64
          examples: [v1]
        designation:
          $ref: "#/components/schemas/Designation"

    Designation:
      type: object
      description: |
        The programme/cohort this course belongs to. Sets the academic level and audience when
        `generation.academic.difficultyLevel` is not supplied.
      required: [id, title]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          examples: [B.Tech CSE - Semester 3]

    GenerationOptions:
      type: object
      description: |
        Optional steering. **Every field has a service-side default**, so screen 1b — which exposes no
        controls today — can omit this object entirely. Defined now so adding an "advanced options" panel
        later is not a breaking change.
      properties:
        structure:
          $ref: "#/components/schemas/StructureOptions"
        academic:
          $ref: "#/components/schemas/AcademicOptions"
        outcomes:
          $ref: "#/components/schemas/OutcomeOptions"
        locale:
          $ref: "#/components/schemas/LocaleOptions"
        sourceFidelity:
          $ref: "#/components/schemas/SourceFidelityOptions"

    CountRange:
      type: object
      description: |
        An inclusive soft target. Expressed as a range, never an exact count, so the AI can follow the
        material rather than pad or truncate to hit a number.
      required: [min, max]
      properties:
        min:
          type: integer
          minimum: 1
        max:
          type: integer
          minimum: 1
      x-constraint: max >= min

    StructureOptions:
      type: object
      description: Soft size targets for the generated tree.
      properties:
        targetModuleCount:
          allOf: [{ $ref: "#/components/schemas/CountRange" }]
          default: { min: 3, max: 8 }
        chaptersPerModule:
          allOf: [{ $ref: "#/components/schemas/CountRange" }]
          default: { min: 2, max: 5 }
        lessonsPerChapter:
          allOf: [{ $ref: "#/components/schemas/CountRange" }]
          default: { min: 2, max: 5 }
        topicsPerLesson:
          allOf: [{ $ref: "#/components/schemas/CountRange" }]
          default: { min: 1, max: 4 }
        subTopicsPerTopic:
          allOf: [{ $ref: "#/components/schemas/CountRange" }]
          default: { min: 2, max: 5 }
        maxDepth:
          type: string
          enum: [MODULE, CHAPTER, LESSON, TOPIC, SUBTOPIC]
          default: SUBTOPIC
          description: |
            Deepest level to generate. Levels below `maxDepth` are returned as **empty arrays, never omitted**,
            so consumers can iterate without existence checks.

    AcademicOptions:
      type: object
      description: Shapes outcome phrasing and depth more than structure.
      properties:
        durationWeeks:
          type: integer
          minimum: 1
          maximum: 52
          description: Term length. Used to pace module count and align with a syllabus week ordering.
          examples: [14]
        difficultyLevel:
          type: string
          enum: [BEGINNER, INTERMEDIATE, ADVANCED]
          description: Defaults to a level derived from `course.designation.title`.
        bloomsLevels:
          type: array
          items:
            type: string
            enum: [REMEMBER, UNDERSTAND, APPLY, ANALYZE, EVALUATE, CREATE]
          default: [UNDERSTAND, APPLY, ANALYZE]
          description: Bloom's taxonomy levels the learning outcomes should be written against.
        prerequisiteKnowledge:
          type: string
          maxLength: 1000
          description: What learners are assumed to already know, so the outline does not re-teach it.
          examples: [Programming fundamentals in C or Java]

    OutcomeOptions:
      type: object
      description: Controls the LEARNING OUTCOMES bullets shown when a row is expanded in screen 1c.
      properties:
        enabled:
          type: boolean
          default: true
        levels:
          type: array
          items:
            type: string
            enum: [MODULE, CHAPTER, LESSON]
          default: [MODULE, CHAPTER, LESSON]
          description: |
            Which levels carry outcomes. Matches 1c exactly — topics and subtopics never show outcome
            bullets, which is why `TOPIC` and `SUBTOPIC` are not valid values.
        perNode:
          allOf: [{ $ref: "#/components/schemas/CountRange" }]
          default: { min: 2, max: 4 }

    LocaleOptions:
      type: object
      properties:
        language:
          type: string
          default: en-IN
          description: BCP-47 tag. Output language for all generated titles, descriptions and outcomes.
          examples: [en-IN]
        academicStandard:
          type: string
          maxLength: 64
          description: Board / university / regulator convention to follow in terminology and structure.
          examples: [AICTE]

    SourceFidelityOptions:
      type: object
      description: How closely the outline must track the uploaded materials.
      properties:
        followSourceOrder:
          type: boolean
          default: true
          description: |
            Preserve the sequence found in the source material (typically syllabus week order) rather than
            reordering pedagogically. Backs the 1c footer copy:
            *"Outline follows your syllabus week order."*
        strictSourceGrounding:
          type: boolean
          default: false
          description: |
            - `true` — every node must be traceable to the uploaded material; gaps are left as gaps.
              `sourceRefs` is populated on every node, and `INSUFFICIENT_SOURCE_MATERIAL` becomes much
              more likely.
            - `false` — the AI may add standard topics the materials omit.

    RegenerateOptions:
      type: object
      required: [previousOutlineId]
      properties:
        previousOutlineId:
          type: string
          format: uuid
          description: "`outlineId` of the result being regenerated."
        preserveEditedNodes:
          type: boolean
          default: true
          description: |
            Backs the 1c copy *"Regenerating keeps your manual edits."* When true, nodes listed in
            `lockedLogicalIds` are echoed back verbatim — same `logicalId`, same title, same outcomes — and
            the AI regenerates only around them.
        lockedLogicalIds:
          type: array
          items:
            type: string
            format: uuid
          default: []
          description: |
            `logicalId`s the teacher hand-edited. **The consumer computes this set** — the AI service does
            not track edit history.
        scope:
          oneOf:
            - $ref: "#/components/schemas/RegenerateScope"
            - type: "null"
          default: null
          description: |
            Limits regeneration to one subtree — this is what the per-row generate actions target. `null`
            regenerates the whole outline.

            When scoped, `result.module[]` still returns the **complete** tree, with untouched nodes echoed
            back unchanged, so the consumer always persists one consistent document.

    RegenerateScope:
      type: object
      required: [level, logicalId]
      properties:
        level:
          type: string
          enum: [MODULE, CHAPTER, LESSON, TOPIC]
        logicalId:
          type: string
          format: uuid

    # ---------- job responses ----------

    JobAcceptedResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/JobAccepted"

    JobAccepted:
      type: object
      required: [jobId, status, estimatedSeconds, pollUrl, pollAfterMs, expiresAt, createdAt]
      properties:
        jobId:
          type: string
          format: uuid
          description: Poll this at the `pollUrl` below. Shared by the outline and content jobs.
        status:
          type: string
          const: QUEUED
          description: Always `QUEUED` on submit.
        estimatedSeconds:
          type: integer
          description: |
            Best-effort estimate of total generation time. Drives the wait affordance between screens
            1b and 1c — the design copy promises "Outline in ~30s".
        pollUrl:
          type: string
          description: Absolute path of the poll endpoint for this job.
        pollAfterMs:
          type: integer
          description: |
            How long to wait before the first poll. Server-controlled so the AI service can shed load
            without a client change.
        expiresAt:
          type: string
          format: date-time
          description: |
            After this instant the job is abandoned and transitions to `FAILED` with `GENERATION_TIMEOUT`.
        createdAt:
          type: string
          format: date-time

    JobStatusResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/JobStatus"

    JobStatus:
      type: object
      required: [jobId, status]
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED]
        progress:
          oneOf:
            - $ref: "#/components/schemas/JobProgress"
            - type: "null"
          description: "`null` while `QUEUED`."
        pollAfterMs:
          type: [integer, "null"]
          description: "`null` once terminal."
        startedAt:
          type: [string, "null"]
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
        result:
          oneOf:
            - $ref: "#/components/schemas/OutlineResult"
            - type: "null"
          description: Populated **only** when `status` is `SUCCEEDED`.
        error:
          oneOf:
            - $ref: "#/components/schemas/JobError"
            - type: "null"
          description: Populated **only** when `status` is `FAILED`.

    JobProgress:
      type: object
      required: [percent, stage, message]
      properties:
        percent:
          type: integer
          minimum: 0
          maximum: 100
        stage:
          type: string
          enum:
            - PARSING_SOURCES
            - DRAFTING_STRUCTURE
            - EXPANDING_LESSONS
            - WRITING_OUTCOMES
            - VALIDATING
        message:
          type: string
          description: Human-readable, safe to surface in the UI.

    JobError:
      type: object
      description: |
        Same shape as `ErrorResponse` minus `status`/`statusCode`, so consumers keep one error-handling path
        for both transport and job failures.
      required: [errorCode, message]
      properties:
        errorCode:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        details:
          type: [object, "null"]
          additionalProperties: true

    CancelResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [jobId, status, cancelledAt]
              properties:
                jobId:
                  type: string
                  format: uuid
                status:
                  type: string
                  const: CANCELLED
                cancelledAt:
                  type: string
                  format: date-time

    # ---------- outline result ----------

    OutlineResult:
      type: object
      description: |
        Payload of `data.result` when a job reaches `SUCCEEDED`.

        The `module[]` subtree maps 1:1 onto the LMS backend's `CreateLessonPlanDto`.
      required: [outlineId, courseVersionId, generatedAt, summary, sources, module]
      properties:
        outlineId:
          type: string
          format: uuid
          description: |
            Identifies this generated outline. Pass as `regenerate.previousOutlineId` to regenerate from it.
        courseVersionId:
          type: string
          format: uuid
          description: Echo of the request field, so the result is a complete persist payload on its own.
        generatedAt:
          type: string
          format: date-time
        model:
          $ref: "#/components/schemas/ModelInfo"
        summary:
          $ref: "#/components/schemas/OutlineSummary"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceUsage"
          description: |
            Powers the **Sources used** panel in 1c. One entry per requested `documentId`, **including any
            that ended up unused**, so the teacher can see what was ignored.
        warnings:
          type: array
          default: []
          items:
            $ref: "#/components/schemas/OutlineWarning"
          description: |
            Non-fatal issues. The job still `SUCCEEDED`; these are advisory and safe to show in 1c.
        module:
          type: array
          items:
            $ref: "#/components/schemas/ModuleNode"
          description: Ordered modules. Key name is singular to match `CreateLessonPlanDto`.

    ModelInfo:
      type: object
      description: Provenance, for auditing and reproducibility.
      properties:
        provider:
          type: string
          examples: [anthropic]
        name:
          type: string
          examples: [claude-opus-5]

    OutlineSummary:
      type: object
      description: |
        Powers the **Outline summary** panel in 1c and the step-indicator subtitle
        (*"3 modules · 28 subtopics"*). Counts are computed over the tree in this same response and
        **must agree with it exactly**.
      required:
        [moduleCount, chapterCount, lessonCount, topicCount, subTopicCount, learningOutcomeCount]
      properties:
        moduleCount: { type: integer, minimum: 0 }
        chapterCount: { type: integer, minimum: 0 }
        lessonCount: { type: integer, minimum: 0 }
        topicCount: { type: integer, minimum: 0 }
        subTopicCount: { type: integer, minimum: 0 }
        learningOutcomeCount:
          type: integer
          minimum: 0
          description: Total across all levels.
        estimatedContentGenerationSeconds:
          type: integer
          description: |
            Estimate for the follow-up bulk content generation. Backs the 1c footer
            *"28 subtopics · est. 4 min"*.

    SourceUsage:
      type: object
      required: [documentId, fileName, kind, used, coverage]
      properties:
        documentId:
          type: string
          format: uuid
        fileName:
          type: string
        kind:
          type: string
          enum: [PDF, PPTX, DOCX, EPUB, TXT]
        used:
          type: boolean
        coverage:
          type: string
          enum: [HIGH, MEDIUM, LOW, NONE]
          description: How much of the outline this document contributed to.

    OutlineWarning:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - SOURCE_PARTIALLY_USED
            - SOURCE_UNUSED
            - STRUCTURE_TARGET_NOT_MET
            - SPARSE_COVERAGE
            - OUTCOMES_TRUNCATED
        message:
          type: string
        documentId:
          type: [string, "null"]
          format: uuid
        logicalId:
          type: [string, "null"]
          format: uuid

    # ---------- shared node fields ----------

    LogicalId:
      type: string
      format: uuid
      description: |
        Stable identity for this node, generated by the AI service.

        The frontend keys tree rows by it and tracks manual edits against it; the consumer persists it into
        the `logicalId` column that **already exists** on `Module`, `Chapter`, `Lesson`, `Topics` and
        `SubTopics`.

        On regenerate, nodes listed in `regenerate.lockedLogicalIds` are echoed back with the same
        `logicalId` — this is what makes *"Regenerating keeps your manual edits"* work.

    OrderIndex:
      type: integer
      minimum: 0
      description: |
        Zero-based position among siblings. Maps to the `orderIndex` column on `ModuleMap` / `ChapterMap` /
        `lessonMap` / `TopicMap` / `subTopicMap`.

        The frontend derives display tags (`MODULE 1`, `CH 1.1`, `LESSON 1.1.2`) from this, which is why
        those strings are **not** in the payload — they must renumber on drag-reorder.

    LearningOutcomes:
      type: array
      default: []
      items:
        type: string
        maxLength: 300
      description: |
        Rendered as the bullet list on the highlighted card when a row is expanded in 1c. Each string is one
        complete, measurable outcome written against the requested Bloom's levels.

        Empty array when `generation.outcomes.enabled` is false or the level is excluded.

        **Requires a new `learningOutcomes String[]` column** — no such field exists in the Prisma schema
        today. See `info.x-dependencies`.
      examples:
        - - Reason about arrays and memory layout to predict access cost and cache behaviour
          - Apply string algorithms and hashing to solve lookup and matching problems

    SourceRef:
      type: object
      required: [documentId, locator]
      properties:
        documentId:
          type: string
          format: uuid
        locator:
          type: string
          description: Human-readable position within the document — page range, slide number, or heading.
          examples: [pp. 1-4]

    SourceRefs:
      type: array
      default: []
      items:
        $ref: "#/components/schemas/SourceRef"
      description: |
        Where this node came from in the uploaded materials. Always populated when
        `generation.sourceFidelity.strictSourceGrounding` is true; best-effort otherwise. Enables a future
        "why is this here" affordance and grounding audits.

    # ---------- tree nodes ----------

    ModuleNode:
      type: object
      required: [logicalId, orderIndex, title, chapter]
      properties:
        logicalId: { $ref: "#/components/schemas/LogicalId" }
        orderIndex: { $ref: "#/components/schemas/OrderIndex" }
        title:
          type: string
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 500
          description: Short summary. Maps to `Module.description`.
        overview:
          type: [string, "null"]
          maxLength: 2000
          description: Longer narrative framing. Maps to `Module.overview`.
        learningOutcomes: { $ref: "#/components/schemas/LearningOutcomes" }
        sourceRefs: { $ref: "#/components/schemas/SourceRefs" }
        chapter:
          type: array
          items:
            $ref: "#/components/schemas/ChapterNode"

    ChapterNode:
      type: object
      required: [logicalId, orderIndex, title, lesson]
      properties:
        logicalId: { $ref: "#/components/schemas/LogicalId" }
        orderIndex: { $ref: "#/components/schemas/OrderIndex" }
        title:
          type: string
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 500
        overview:
          type: [string, "null"]
          maxLength: 2000
        learningOutcomes: { $ref: "#/components/schemas/LearningOutcomes" }
        sourceRefs: { $ref: "#/components/schemas/SourceRefs" }
        lesson:
          type: array
          items:
            $ref: "#/components/schemas/LessonNode"

    LessonNode:
      type: object
      required: [logicalId, orderIndex, title, topic]
      properties:
        logicalId: { $ref: "#/components/schemas/LogicalId" }
        orderIndex: { $ref: "#/components/schemas/OrderIndex" }
        title:
          type: string
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 500
        overview:
          type: [string, "null"]
          maxLength: 2000
        learningOutcomes: { $ref: "#/components/schemas/LearningOutcomes" }
        sourceRefs: { $ref: "#/components/schemas/SourceRefs" }
        topic:
          type: array
          items:
            $ref: "#/components/schemas/TopicNode"

    TopicNode:
      type: object
      description: |
        **No `learningOutcomes`** — 1c shows outcome bullets on module/chapter/lesson only. Topic rows render
        `title` plus `description` as a subtitle.
      required: [logicalId, orderIndex, title, isMandatory, subTopic]
      properties:
        logicalId: { $ref: "#/components/schemas/LogicalId" }
        orderIndex: { $ref: "#/components/schemas/OrderIndex" }
        title:
          type: string
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 300
          description: Rendered as the grey subtitle on the TOPIC row in 1c.
          examples: [Reads, writes and growth behaviour]
        overview:
          type: [string, "null"]
          maxLength: 2000
        isMandatory:
          type: boolean
          default: true
          description: Maps to `Topics.isMandatory`. Required by `CreateTopicDto`.
        sourceRefs: { $ref: "#/components/schemas/SourceRefs" }
        subTopic:
          type: array
          items:
            $ref: "#/components/schemas/SubTopicNode"

    SubTopicNode:
      type: object
      description: |
        Leaf node. Carries **no `content` field** — subtopic content (explanation, examples, figure) is
        produced by the separate bulk content-generation contract driving screen 1d. In 1c these render with
        a `Pending` badge and a Generate action.
      required: [logicalId, orderIndex, title, isMandatory, contentStatus]
      properties:
        logicalId: { $ref: "#/components/schemas/LogicalId" }
        orderIndex: { $ref: "#/components/schemas/OrderIndex" }
        title:
          type: string
          maxLength: 200
        isMandatory:
          type: boolean
          default: true
          description: Maps to `SubTopics.isMandatory`. Required by `CreateSubTopicDto`.
        contentStatus:
          type: string
          enum: [PENDING]
          description: |
            Always `PENDING` from this contract — the outline produces no content.

            The full set of values a persisted SubTopic can hold is `ContentStatus`, widened by the
            **course-content** tag. It is narrowed to `PENDING` here so 1c can render the badge from one
            field across both flows.

    # ---------- content request ----------

    GenerateContentRequest:
      type: object
      required: [courseId, courseVersionId, outlineId, course, documentIds, targets]
      properties:
        courseId:
          type: string
          format: uuid
          description: "`Course.id` in the LMS. Echoed for correlation; the AI service does not resolve it."
        courseVersionId:
          type: string
          format: uuid
          description: |
            `CourseVersion.id` the content will be persisted against. Echoed back in the result so the
            result is a complete persist payload on its own.
        outlineId:
          type: string
          format: uuid
          description: |
            `outlineId` of the `OutlineResult` these subtopics came from. Provenance only — the AI service
            does not resolve it, and content generation still works after the outline job has expired.
        course:
          allOf: [{ $ref: "#/components/schemas/CourseMetadata" }]
          description: |
            Same object as the outline request. Sets voice, level and scope boundaries for the writing —
            `type: SELF_PACED` in particular pushes the explanation to be self-contained, since there is
            no instructor in the room to fill gaps.
        documentIds:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            format: uuid
          description: |
            The same processed course materials the outline was generated from. Content is grounded in
            these; `sourceRefs` on the result points back into them.

            **Depends on the document ingest contract, which does not exist yet.**
        targets:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/ContentTarget"
          description: |
            The SubTopics to write content for. 1d submits the whole course (28 in the design mock), 1c's
            per-row action and 1e's regenerate submit exactly one.

            Order is not significant — the service may generate in any order, and `items[]` in the result
            is keyed by `subTopicLogicalId`, not by position.
        generation:
          $ref: "#/components/schemas/ContentGenerationOptions"
        regenerate:
          oneOf:
            - $ref: "#/components/schemas/ContentRegenerateOptions"
            - type: "null"
          default: null
          description: |
            Present only when rewriting content that already exists — the ✦ AI toolkit in 1e. Absent or
            `null` means a first pass.
      x-constraint: when `regenerate` is non-null, `targets` must contain exactly one item

    ContentTarget:
      type: object
      description: |
        One SubTopic to write content for, carrying everything the generation needs. Self-contained by
        design: the service holds no outline, so each target is independently processable.
      required: [subTopicLogicalId, title, ancestry]
      properties:
        subTopicLogicalId:
          allOf: [{ $ref: "#/components/schemas/LogicalId" }]
          description: |
            `logicalId` of the `SubTopicNode` from the outline. This is the join key — every entry in
            `result.items[]` echoes it, and the consumer persists content against the matching row.
        title:
          type: string
          maxLength: 200
          description: |
            The SubTopic title. **The single strongest signal for what the explanation must be about** —
            "Insertion & deletion" under a topic about arrays means array insertion and deletion, nothing
            broader.
          examples: [Amortized resizing]
        orderIndex:
          $ref: "#/components/schemas/OrderIndex"
        isMandatory:
          type: boolean
          default: true
          description: |
            Echo of `SubTopicNode.isMandatory`. Optional subtopics may be written more briefly, since the
            course does not depend on them.
        ancestry:
          $ref: "#/components/schemas/ContentAncestry"
        sourceRefs:
          allOf: [{ $ref: "#/components/schemas/SourceRefs" }]
          description: |
            Where the outline placed this subtopic in the source material, carried over from the ancestor
            node. Narrows which pages the content should be grounded in rather than re-searching every
            document.
        focus:
          type: [string, "null"]
          maxLength: 500
          default: null
          description: |
            Free-text steering for this target only — what the teacher wants emphasised. Distinct from
            `regenerate.instruction`, which rewrites content that already exists.
          examples:
            - Lead with why doubling and not a fixed increment - that is where the class always gets stuck.

    ContentAncestry:
      type: object
      description: |
        Where this SubTopic sits in the outline, **with the learning outcomes each ancestor carries**.

        This is the heart of the contract. The outline decided what the learner must be able to do; every
        block generated here must serve at least one of those outcomes, resolved nearest level first —
        lesson, then chapter, then module. `content.outcomeCoverage` reports back which ones it hit.

        Topics carry no outcomes by design (see `TopicNode`), so that level contributes framing only.

        Ancestry repeats on every target rather than being sent once as a tree. That costs payload size
        on a 50-target batch and buys two things worth more: targets stay independently processable, and
        the request survives the outline job's 1-hour retention window expiring.
      required: [module, chapter, lesson, topic]
      properties:
        module:
          $ref: "#/components/schemas/ContentAncestorNode"
        chapter:
          $ref: "#/components/schemas/ContentAncestorNode"
        lesson:
          $ref: "#/components/schemas/ContentAncestorNode"
        topic:
          $ref: "#/components/schemas/ContentTopicContext"

    ContentAncestorNode:
      type: object
      description: An outcome-carrying ancestor — MODULE, CHAPTER or LESSON.
      required: [logicalId, title]
      properties:
        logicalId:
          $ref: "#/components/schemas/LogicalId"
        title:
          type: string
          maxLength: 200
        learningOutcomes:
          allOf: [{ $ref: "#/components/schemas/LearningOutcomes" }]
          description: |
            The outcomes the outline generated for this level. Empty when the teacher turned outcomes off,
            or when the level was excluded from `generation.outcomes.levels` on the outline request — the
            content is then written from titles alone and an `OUTCOME_NOT_COVERED` warning is raised.

    ContentTopicContext:
      type: object
      description: |
        The parent TOPIC. Carries no outcomes — 1c shows outcome bullets on module/chapter/lesson only —
        so it contributes scope and framing: what its sibling subtopics cover, and therefore what this one
        should not repeat.
      required: [logicalId, title]
      properties:
        logicalId:
          $ref: "#/components/schemas/LogicalId"
        title:
          type: string
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 300
        overview:
          type: [string, "null"]
          maxLength: 2000

    ContentGenerationOptions:
      type: object
      description: |
        Optional steering. **Every field has a service-side default**, so screen 1d — which exposes no
        controls — can omit this object entirely. Defined now so adding a controls panel later is not a
        breaking change.
      properties:
        depth:
          type: string
          enum: [BRIEF, STANDARD, DEEP]
          default: STANDARD
          description: |
            Overall thoroughness. `BRIEF` suits revision material and optional subtopics; `DEEP` writes
            the derivations and edge cases out in full. Moves explanation length, example count and
            teacher-note detail together.
        explanation:
          $ref: "#/components/schemas/ContentExplanationOptions"
        examples:
          $ref: "#/components/schemas/ContentExampleOptions"
        image:
          $ref: "#/components/schemas/ContentImageOptions"
        teacherAids:
          $ref: "#/components/schemas/ContentTeacherAidOptions"
        academic:
          $ref: "#/components/schemas/ContentAcademicOptions"
        locale:
          $ref: "#/components/schemas/LocaleOptions"
        sourceFidelity:
          $ref: "#/components/schemas/SourceFidelityOptions"

    ContentExplanationOptions:
      type: object
      description: Shapes the markdown that lands in `content`.
      properties:
        targetWords:
          allOf: [{ $ref: "#/components/schemas/CountRange" }]
          default: { min: 250, max: 600 }
          description: Soft length target. A subtopic with more to say is allowed to run longer.
        includeSummary:
          type: boolean
          default: true
          description: |
            Close the explanation with a short recap. Useful in `SELF_PACED` courses where nobody
            summarises out loud.

    ContentExampleOptions:
      type: object
      description: Shapes the `examples[]` carousel in 1e.
      properties:
        perSubTopic:
          allOf: [{ $ref: "#/components/schemas/CountRange" }]
          default: { min: 2, max: 4 }
          description: |
            Soft target. Fewer are returned — with an `EXAMPLES_BELOW_TARGET` warning — rather than
            padding a subtopic that genuinely has one good example.
        preferredKinds:
          type: array
          items:
            $ref: "#/components/schemas/ContentExampleKind"
          default: []
          description: |
            Bias, not a filter. Empty means the service picks per subtopic — which is usually right, since
            a definition-heavy subtopic wants an analogy where an algorithm wants code.
        codeLanguage:
          type: [string, "null"]
          default: null
          description: |
            Language for `CODE` examples. `null` lets the service infer from the course material — a Java
            syllabus should not get Python samples.
          examples: [python]

    ContentImageOptions:
      type: object
      description: Shapes the single `image` block in 1e's FIGURE panel.
      properties:
        enabled:
          type: boolean
          default: true
          description: When false, `image` is always `null` and no `IMAGE_OMITTED` warning is raised.
        preferredFormats:
          type: array
          items:
            type: string
            enum: [MERMAID, SVG]
          default: [MERMAID]
          description: |
            Diagram-as-code formats the consumer can render. The service only emits `image.source` in a
            listed format; anything it cannot express that way falls back to `prompt` alone.
        allowPromptOnly:
          type: boolean
          default: true
          description: |
            Allow an illustration that is only a specification — caption, alt text and a generation prompt
            with no renderable `source`. When false, a subtopic whose figure cannot be expressed as
            diagram-as-code returns `image: null` plus an `IMAGE_OMITTED` warning.

    ContentTeacherAidOptions:
      type: object
      description: Selects which teacher-facing blocks are produced.
      properties:
        include:
          type: array
          items:
            $ref: "#/components/schemas/TeacherAidKind"
          default: [TEACHER_NOTES, COMMON_MISCONCEPTIONS]
          description: |
            Aids **not** listed here are omitted from `teacherAids` entirely. The default is the pair every
            subtopic can support; the rest are opt-in because they cost generation time and not every
            subtopic has anything real to say for each one.

    ContentAcademicOptions:
      type: object
      description: |
        Level and cognitive demand. Deliberately not the outline's `AcademicOptions` — `durationWeeks` and
        `prerequisiteKnowledge` are course-wide concerns that mean nothing inside one subtopic.
      properties:
        difficultyLevel:
          type: string
          enum: [BEGINNER, INTERMEDIATE, ADVANCED]
          description: Defaults to a level derived from `course.designation.title`.
        bloomsLevels:
          type: array
          items:
            type: string
            enum: [REMEMBER, UNDERSTAND, APPLY, ANALYZE, EVALUATE, CREATE]
          default: [UNDERSTAND, APPLY, ANALYZE]
          description: |
            Cognitive levels the examples and check-for-understanding questions should demand. Should match
            what the outline used, or the content will undershoot the outcomes it is meant to serve.

    ContentRegenerateOptions:
      type: object
      description: |
        Rewrites content that already exists. Backs the ✦ AI toolkit in 1e.

        Block-scoped on purpose: fixing the examples should not re-bill — or silently reword — an
        explanation the teacher already approved.
      required: [previousContentId]
      properties:
        previousContentId:
          type: string
          format: uuid
          description: |
            `contentId` of the `ContentItem` being replaced. Unknown or cross-tenant resolves as
            `404 CONTENT_NOT_FOUND`.
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/ContentBlock"
          default: []
          description: |
            Which blocks to rewrite. **Empty means all of them** — the ✦ Regenerate subtopic button.
            Blocks not listed are echoed back byte-for-byte, and the returned `version` still increments
            so the version history in 1e stays a straight line.
        quickAction:
          oneOf:
            - $ref: "#/components/schemas/ContentQuickAction"
            - type: "null"
          default: null
          description: The Quick actions chips in 1e. Combines with `instruction`; neither requires the other.
        instruction:
          type: [string, "null"]
          maxLength: 1000
          default: null
          description: |
            The "Regenerate with a custom prompt" box in 1e. Free-text steering in the teacher's own words.
            Never a system instruction — it steers the writing, it does not change the contract.
          examples: [Use Python instead of pseudocode, and add a dry run over six appends.]
        preserveEditedBlocks:
          type: boolean
          default: true
          description: |
            When true, blocks the teacher hand-edited are echoed back verbatim even if listed in `blocks`.
            **The consumer computes which those are** — the AI service does not track edit history, exactly
            as with `regenerate.lockedLogicalIds` on the outline.

    ContentBlock:
      type: string
      description: An independently regenerable part of a SubTopic's content.
      enum:
        - CONTENT
        - EXAMPLES
        - IMAGE
        - TEACHER_NOTES
        - COMMON_MISCONCEPTIONS
        - TEACHER_AIDS

    ContentQuickAction:
      type: string
      description: |
        One-click rewrite intents. These are the four chips under **Quick actions** in the 1e AI toolkit.

        | Value | Chip | Effect |
        |---|---|---|
        | `SIMPLIFY` | Simplify | Plainer language, shorter sentences, same ground covered |
        | `EXPAND` | Expand | More depth, more edge cases, derivations written out |
        | `ADD_PRACTICE_PROBLEM` | Practice problem | Appends a `WORKED_PROBLEM` example, leaves the rest |
        | `SUGGEST_DIAGRAM` | Suggest diagram | Produces or replaces `image`, leaves the text alone |
      enum:
        - SIMPLIFY
        - EXPAND
        - ADD_PRACTICE_PROBLEM
        - SUGGEST_DIAGRAM

    TeacherAidKind:
      type: string
      description: |
        Selector for the optional teacher-facing blocks. Each value maps to the same-named camelCase field
        on `TeacherAids`.
      enum:
        - TEACHER_NOTES
        - COMMON_MISCONCEPTIONS
        - TEACHING_TIPS
        - DISCUSSION_PROMPTS
        - ESTIMATED_DURATION
        - CHECK_FOR_UNDERSTANDING
        - PRACTICE_IDEAS
        - KEY_TERMS
        - PREREQUISITES
        - REAL_WORLD_APPLICATIONS
        - FURTHER_READING
        - DIFFERENTIATION
        - COMMON_PITFALLS

    ContentExampleKind:
      type: string
      description: |
        What kind of example this is. Determines which optional fields on `ContentExample` are populated —
        see that schema's `x-constraint`.

        | Value | Shape |
        |---|---|
        | `CODE` | A runnable or near-runnable snippet, with a language |
        | `WORKED_PROBLEM` | A question solved step by step, ending in an answer |
        | `DRY_RUN` | A trace of an algorithm over concrete input, step by step |
        | `TABLE` | Tabular data making a pattern visible — costs, states, comparisons |
        | `QUESTION_ANSWER` | A single question with its answer, for self-check |
        | `SCENARIO` | A real situation where the concept decides the outcome |
        | `ANALOGY` | A familiar system that behaves the same way |
      enum:
        - CODE
        - WORKED_PROBLEM
        - DRY_RUN
        - TABLE
        - QUESTION_ANSWER
        - SCENARIO
        - ANALOGY

    # ---------- content job responses ----------

    ContentJobStatusResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/ContentJobStatus"

    ContentJobStatus:
      type: object
      description: |
        Job state for a content generation run. Same shape as the outline's `JobStatus` with one
        deliberate difference — see `result`.
      required: [jobId, status]
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED]
          description: |
            Job-level state, distinct from the per-subtopic `items[].status`.

            - `SUCCEEDED` — **at least one** item is `READY`. Individual failures ride in
              `items[].error`; they do not fail the job.
            - `FAILED` — every item failed, or the job broke before producing anything. `data.error` is
              set and `result` may be `null`.
            - `CANCELLED` — stopped from 1d. Items already `READY` are still in `result`.
        progress:
          oneOf:
            - $ref: "#/components/schemas/ContentJobProgress"
            - type: "null"
          description: "`null` while `QUEUED`."
        pollAfterMs:
          type: [integer, "null"]
          description: "`null` once terminal."
        startedAt:
          type: [string, "null"]
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
        result:
          oneOf:
            - $ref: "#/components/schemas/ContentResult"
            - type: "null"
          description: |
            **Populated from `RUNNING` onward — not only when `SUCCEEDED`.** This is a deliberate
            divergence from the outline job, and it is what screen 1d's promise *"finished subtopics
            unlock as they're ready"* requires: a `READY` item is complete and openable in the workbench
            while its siblings are still being written.

            `null` only while `QUEUED`, or on a job that failed before writing anything.

            Every entry carries its own `status`, so there is no ambiguity between "not generated yet" and
            "generated as empty". A consumer that only wants the finished batch can ignore `result` until
            `status` is terminal — the shape does not change.
        error:
          oneOf:
            - $ref: "#/components/schemas/JobError"
            - type: "null"
          description: |
            Job-level failure only. A single subtopic failing surfaces in `result.items[].error`, not here.

    ContentJobProgress:
      type: object
      description: |
        Drives the 1d progress panel: the bar from `percent`, the label from `message`, and the
        "24 of 28 ready" line from the counts.
      required: [percent, stage, message, total, ready, failed]
      properties:
        percent:
          type: integer
          minimum: 0
          maximum: 100
        stage:
          type: string
          description: |
            Coarsest description of what the job is doing now. On a batch the stages overlap across
            subtopics — this reports the dominant one, not a per-item state.
          enum:
            - PREPARING
            - RESOLVING_SOURCES
            - WRITING_EXPLANATION
            - WRITING_EXAMPLES
            - DESIGNING_IMAGE
            - WRITING_TEACHER_AIDS
            - VALIDATING
        message:
          type: string
          description: Human-readable, safe to surface in the UI. This is 1d's progress label verbatim.
          examples: [Generating 12 of 28 subtopics]
        total:
          type: integer
          minimum: 0
          description: Number of targets in the job. Equals `targets.length` from the request.
        ready:
          type: integer
          minimum: 0
          description: Items that have reached `READY` and can be opened now.
        failed:
          type: integer
          minimum: 0

    # ---------- content result ----------

    ContentResult:
      type: object
      description: |
        Payload of `data.result`. Grows as the job runs — see `ContentJobStatus.result`.
      required: [contentSetId, courseVersionId, outlineId, generatedAt, summary, items]
      properties:
        contentSetId:
          type: string
          format: uuid
          description: |
            Identifies this generation run as a whole. Useful for audit and for grouping a bulk run in the
            LMS; **not** what regeneration takes — that is the per-subtopic `items[].contentId`.
        courseVersionId:
          type: string
          format: uuid
          description: Echo of the request field, so the result is a complete persist payload on its own.
        outlineId:
          type: string
          format: uuid
          description: Echo of the request field. Ties this content to the outline that specified it.
        generatedAt:
          type: string
          format: date-time
          description: When this snapshot was produced. Advances on every poll while the job runs.
        model:
          $ref: "#/components/schemas/ModelInfo"
        summary:
          $ref: "#/components/schemas/ContentSummary"
        sources:
          type: array
          default: []
          items:
            $ref: "#/components/schemas/SourceUsage"
          description: |
            How the requested documents were actually used across the batch. One entry per requested
            `documentId`, **including any that ended up unused**.
        warnings:
          type: array
          default: []
          items:
            $ref: "#/components/schemas/ContentWarning"
          description: |
            Non-fatal issues, safe to show the teacher. A failed subtopic raises one of these *and* sets
            `items[].error` — the warning is the batch-level view, the error is the row-level one.
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContentItem"
          description: |
            One entry per requested target, present from the moment the job starts running — including
            targets not begun yet, which sit at `QUEUED`. Keyed by `subTopicLogicalId`, not by position.

    ContentSummary:
      type: object
      description: |
        Batch rollup. Backs 1e's "24 of 28 ready" header and 1d's completion label. Counts are computed
        over `items[]` in this same response and **must agree with it exactly**.
      required: [requested, ready, failed, cancelled]
      properties:
        requested:
          type: integer
          minimum: 0
        ready:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        cancelled:
          type: integer
          minimum: 0
          description: Targets abandoned by a cancel. Always 0 on a job that ran to completion.
        exampleCount:
          type: integer
          minimum: 0
          description: Total examples across every `READY` item.
        imageCount:
          type: integer
          minimum: 0
          description: "`READY` items that got an illustration. Lower than `ready` when figures were omitted."

    ContentItem:
      type: object
      description: |
        One row in screen 1d, and one subtopic's worth of content for screen 1e.
      required: [subTopicLogicalId, title, status]
      properties:
        subTopicLogicalId:
          allOf: [{ $ref: "#/components/schemas/LogicalId" }]
          description: Echo of the target. The join key for persisting against the right `SubTopics` row.
        title:
          type: string
          maxLength: 200
          description: Echo of the target title, so 1d can render rows without holding the request.
        breadcrumb:
          type: [string, "null"]
          default: null
          description: |
            Pre-rendered ancestry path, derived from `ancestry`. The grey subtitle under each row in 1d.
            `null` if the service chose not to render one — the consumer can always rebuild it.
          examples: [Module 1 · Ch 1.1 · Static & Dynamic Arrays]
        status:
          $ref: "#/components/schemas/ContentStatus"
        contentId:
          type: [string, "null"]
          format: uuid
          default: null
          description: |
            Identifies this subtopic's generated content. `null` until `READY`. Pass as
            `regenerate.previousContentId` to rewrite it.
        version:
          type: [integer, "null"]
          minimum: 1
          default: null
          description: |
            `1` on first generation, incremented on every regenerate. Backs the "Ready · v3" pill and the
            Version history list in 1e.

            **The AI service does not store superseded versions** — it only numbers them. Keeping the
            history is the LMS's job; see `x-dependencies.content-version-history`.
        generatedAt:
          type: [string, "null"]
          format: date-time
          default: null
        content:
          oneOf:
            - $ref: "#/components/schemas/SubTopicContent"
            - type: "null"
          default: null
          description: Populated **only** when `status` is `READY`.
        error:
          oneOf:
            - $ref: "#/components/schemas/JobError"
            - type: "null"
          default: null
          description: |
            Populated **only** when `status` is `FAILED`. Same shape as a transport error, so consumers
            keep one error-handling path. Retry by submitting a new job with just this target.

    ContentStatus:
      type: string
      description: |
        Content state of a single SubTopic. One field drives the badge on every screen that shows one —
        the `Pending` badge in 1c, the Queued/Generating/Ready badges in 1d, and the Ready pill in 1e.

        | Value | Meaning | Where it shows |
        |---|---|---|
        | `PENDING` | Never requested. The only value the outline contract emits | 1c |
        | `QUEUED` | In this job, not started | 1d |
        | `GENERATING` | Being written now | 1d |
        | `READY` | `content` is populated and openable | 1d, 1e |
        | `FAILED` | Generation failed; `error` is set. Retryable per subtopic | 1d |
        | `CANCELLED` | Abandoned by a cancel before it started | 1d |
      enum:
        - PENDING
        - QUEUED
        - GENERATING
        - READY
        - FAILED
        - CANCELLED

    ContentWarning:
      type: object
      description: |
        Non-fatal issue. The job still `SUCCEEDED`; these are advisory and safe to show in 1d.
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            | Code | Meaning |
            |---|---|
            | `SUBTOPIC_CONTENT_FAILED` | One subtopic failed; the rest of the batch is fine |
            | `IMAGE_OMITTED` | No figure was warranted, or none could be expressed as diagram-as-code |
            | `EXAMPLES_BELOW_TARGET` | Fewer examples than `perSubTopic.min`, rather than padding |
            | `OUTCOME_NOT_COVERED` | A learning outcome in the ancestry that no generated block serves |
            | `SPARSE_SOURCE_COVERAGE` | Thin material for this subtopic; more was written from general knowledge |
            | `TEACHER_AID_OMITTED` | A requested aid had nothing genuine to say for this subtopic |
            | `CONTENT_TRUNCATED` | The explanation hit the length ceiling and was cut |
          enum:
            - SUBTOPIC_CONTENT_FAILED
            - IMAGE_OMITTED
            - EXAMPLES_BELOW_TARGET
            - OUTCOME_NOT_COVERED
            - SPARSE_SOURCE_COVERAGE
            - TEACHER_AID_OMITTED
            - CONTENT_TRUNCATED
        message:
          type: string
          description: Human-readable and safe to render directly in the UI.
        subTopicLogicalId:
          type: [string, "null"]
          format: uuid
          default: null
          description: The subtopic this concerns. `null` for batch-wide warnings.
        documentId:
          type: [string, "null"]
          format: uuid
          default: null

    # ---------- subtopic content ----------

    SubTopicContent:
      type: object
      description: |
        Everything generated for one SubTopic.

        The first three fields are named to match the `SubTopics` Prisma model (`content String?`,
        `examples Json?`, `image Json?`) and the existing `POST /sub-topic` / `PATCH /sub-topic` DTOs, so a
        `READY` item persists with no translation layer — the same drop-in discipline the outline contract
        follows for `CreateLessonPlanDto`.

        `teacherAids`, `outcomeCoverage` and `sourceRefs` have no column today. See `x-dependencies`.
      required: [content, examples, image, teacherAids]
      properties:
        content:
          type: string
          maxLength: 20000
          description: |
            The explanation, in **markdown**. Rendered in 1e's `EXPLANATION · MARKDOWN` block and shown to
            students.

            This is the subtopic taught, not summarised: what the concept is, how it works, and why it
            behaves the way it does — written against the ancestry's learning outcomes. Headings (`##`),
            emphasis, lists, blockquotes, inline code and fenced code are all in scope; raw HTML is not.

            Maps to `SubTopics.content`.
        examples:
          type: array
          maxItems: 8
          default: []
          items:
            $ref: "#/components/schemas/ContentExample"
          description: |
            Worked material that makes the explanation concrete — code, problems, traces, Q&A. Rendered as
            the `EXAMPLES` carousel in 1e, one card per entry, with the count in the header.

            May legitimately be empty for a purely definitional subtopic; an `EXAMPLES_BELOW_TARGET`
            warning says so rather than padding.

            Maps to `SubTopics.examples` (Json).
        image:
          oneOf:
            - $ref: "#/components/schemas/ContentImage"
            - type: "null"
          description: |
            One illustration, or `null` when the subtopic does not warrant one. Rendered as the `FIGURE`
            block in 1e, which shows exactly one figure with a ↻ Replace image action — hence singular.

            Maps to `SubTopics.image` (Json).
        teacherAids:
          $ref: "#/components/schemas/TeacherAids"
        outcomeCoverage:
          type: array
          default: []
          items:
            $ref: "#/components/schemas/OutcomeCoverage"
          description: |
            Which of the ancestry's learning outcomes this content actually serves. Makes grounding
            auditable instead of assumed — an outcome nothing covers raises `OUTCOME_NOT_COVERED`.

            Not student-facing.
        sourceRefs:
          allOf: [{ $ref: "#/components/schemas/SourceRefs" }]
          description: |
            Where in the uploaded materials this content came from. Always populated when
            `generation.sourceFidelity.strictSourceGrounding` is true; best-effort otherwise.
        readingTimeMinutes:
          type: [integer, "null"]
          minimum: 1
          default: null
          description: Estimated student reading time for `content` alone, excluding examples.

    ContentExample:
      type: object
      description: |
        One example card. `kind` decides which optional fields are populated — everything not relevant to
        the kind is `null` or `[]`, never absent, so consumers can render without existence checks.
      required: [kind, title]
      properties:
        kind:
          $ref: "#/components/schemas/ContentExampleKind"
        title:
          type: string
          maxLength: 200
          description: |
            Card label in the 1e carousel. Written to be scannable — the design mock shows
            "Code · push with doubling", "Cost table · n = 1…16", "Worked example · 6 appends".
          examples: [Worked example · 6 appends]
        explanation:
          type: [string, "null"]
          maxLength: 2000
          default: null
          description: Markdown. Why this example is here and what to notice in it.
        language:
          type: [string, "null"]
          default: null
          description: Language tag for `code`, suitable for a syntax highlighter. `CODE` only.
          examples: [python]
        code:
          type: [string, "null"]
          maxLength: 4000
          default: null
          description: |
            The snippet, trace or table body, as preformatted text. Populated for `CODE`, `DRY_RUN` and
            `TABLE`. Rendered in the monospace panel in 1e.
        output:
          type: [string, "null"]
          maxLength: 2000
          default: null
          description: What running `code` prints. `CODE` only, and only when the snippet is runnable.
        question:
          type: [string, "null"]
          maxLength: 1000
          default: null
          description: The prompt to the student. `WORKED_PROBLEM`, `QUESTION_ANSWER` and `SCENARIO`.
        steps:
          type: array
          default: []
          items:
            type: string
            maxLength: 500
          description: |
            The solution or trace, one step per entry. `WORKED_PROBLEM` and `DRY_RUN`. Kept as an array,
            not one markdown blob, so a teacher can reveal steps one at a time in class.
        answer:
          type: [string, "null"]
          maxLength: 1000
          default: null
          description: |
            The result the steps arrive at. `WORKED_PROBLEM`, `QUESTION_ANSWER` and `SCENARIO`.
        difficulty:
          type: [string, "null"]
          enum: [EASY, MEDIUM, HARD, null]
          default: null
      x-constraint: |
        Fields populated by kind — everything else is null/[]:
        CODE → language, code, output; WORKED_PROBLEM → question, steps, answer;
        DRY_RUN → code, steps; TABLE → code; QUESTION_ANSWER → question, answer;
        SCENARIO → question, answer; ANALOGY → explanation only.
        `explanation` and `difficulty` are valid on any kind.

    ContentImage:
      type: object
      description: |
        A **specification** for an illustration, not an image.

        The AI service renders nothing and hosts nothing — there is no `imageUrl` here, deliberately. What
        it produces is everything needed to make the figure: a caption, accessible alt text, a generation
        prompt for a downstream image model or a human illustrator, and — when the concept is diagrammable
        — renderable diagram-as-code the consumer can display today with no image pipeline at all.

        Rendered as the `FIGURE` block in 1e.
      required: [kind, title, caption, altText, prompt]
      properties:
        kind:
          type: string
          enum:
            - DIAGRAM
            - FLOWCHART
            - TIMELINE
            - TABLE
            - COMPARISON
            - TREE
            - GRAPH
            - SEQUENCE
            - STATE_MACHINE
            - CHART
            - PHOTO
          description: |
            What sort of figure this is. Lets the consumer pick a renderer — `PHOTO` is the one kind that
            can never have a `source` and always needs an image model or a stock lookup.
        title:
          type: string
          maxLength: 120
          description: Figure header in 1e — the mock shows "CAPACITY DOUBLING 1→2→4→8".
          examples: [Capacity doubling 1→2→4→8]
        caption:
          type: string
          maxLength: 300
          description: |
            The explanatory line under the figure. States what the figure proves, not what it depicts —
            the design mock reads *"Each grow copies every element once — total copies across n appends
            stay ≤ 2n, so the amortized cost per append is O(1)."*
        altText:
          type: string
          maxLength: 300
          description: |
            Screen-reader description. **Required, not optional** — this is student-facing course material
            and an unlabelled figure is inaccessible content. Describes the figure's structure and what it
            shows, not just its subject.
        prompt:
          type: string
          maxLength: 1500
          description: |
            A complete, self-contained instruction for producing the image — for a downstream image model
            or a human illustrator. Specific enough to be actionable without reading the explanation:
            what to draw, how to lay it out, what to label, what style.
        labels:
          type: array
          default: []
          items:
            type: string
            maxLength: 80
          description: |
            The callouts that belong inside the figure. Kept separate from `prompt` so the consumer can
            translate them, or overlay them on a rendered image, without regenerating anything.
          examples:
            - - cap 2 · full → grow · 1 copy
              - free slot
        source:
          oneOf:
            - $ref: "#/components/schemas/ContentImageSource"
            - type: "null"
          default: null
          description: |
            Renderable diagram-as-code, when the figure can be expressed that way in one of
            `generation.image.preferredFormats`. `null` for figures that cannot be — a photo, a rich
            illustration — leaving `prompt` as the only route to an image.

    ContentImageSource:
      type: object
      description: Diagram-as-code the consumer can render directly. Deterministic, diffable, and editable.
      required: [format, code]
      properties:
        format:
          type: string
          enum: [MERMAID, SVG]
        code:
          type: string
          maxLength: 8000
          description: |
            The diagram source. For `SVG`, a complete standalone document with no external references and
            no scripts — it is rendered inside the course page.

    TeacherAids:
      type: object
      description: |
        The teacher-facing half of a subtopic. Never shown to students.

        `teacherNotes` and `commonMisconceptions` are always present — every subtopic can support both.
        The remaining blocks are opt-in via `generation.teacherAids.include`, because they cost generation
        time and not every subtopic has anything real to say for each one.

        **Presence rules**, which matter for rendering:

        - **Omitted** — the aid was not requested in `include`.
        - **`null` / `[]`** — it was requested, and this subtopic genuinely had nothing worth saying. A
          `TEACHER_AID_OMITTED` warning accompanies it.

        That distinction is what keeps "not every subtopic satisfies every property" machine-readable
        rather than a guess. **No column exists for any of this** — see `x-dependencies`.
      required: [teacherNotes, commonMisconceptions]
      properties:
        teacherNotes:
          type: string
          maxLength: 4000
          description: |
            Markdown. The teacher's hand notes: what to actually teach in the class and in what order.

            Written to be read at a glance minutes before the session — where to open, what to put on the
            board, which step to slow down on, what to skip, where the class usually stalls. Not a summary
            of `content`; the teacher has already read that.
        commonMisconceptions:
          type: array
          maxItems: 6
          default: []
          items:
            $ref: "#/components/schemas/Misconception"
          description: |
            What students reliably get wrong about **this specific subtopic** — the errors a teacher would
            recognise from having taught it before, not generic study advice.
        teachingTips:
          type: [array, "null"]
          default: null
          items:
            type: string
            maxLength: 300
          description: How to pitch this in class — framings, demos and openings that land.
        discussionPrompts:
          type: [array, "null"]
          default: null
          items:
            type: string
            maxLength: 300
          description: Questions that open discussion rather than close it. For seminars and flipped sessions.
        estimatedDurationMinutes:
          type: [integer, "null"]
          minimum: 1
          default: null
          description: Realistic classroom time for this subtopic, including the examples. Backs lesson pacing.
        checkForUnderstanding:
          type: [array, "null"]
          default: null
          items:
            $ref: "#/components/schemas/CheckQuestion"
          description: |
            Quick in-class checks with their answers — the "does anyone actually have this" questions.
            Formative, not graded; graded assessment is the separate assignment contract.
        practiceIdeas:
          type: [array, "null"]
          default: null
          items:
            type: string
            maxLength: 300
          description: Homework and lab exercises to set. Prompts for a teacher, not finished questions.
        keyTerms:
          type: [array, "null"]
          default: null
          items:
            $ref: "#/components/schemas/KeyTerm"
          description: The vocabulary introduced here, defined in the sense this subtopic uses.
        prerequisites:
          type: [array, "null"]
          default: null
          items:
            type: string
            maxLength: 200
          description: |
            What students must already hold for this to land. Lets a teacher spot the gap before the class
            rather than during it.
        realWorldApplications:
          type: [array, "null"]
          default: null
          items:
            type: string
            maxLength: 300
          description: Where this actually shows up in practice. Answers "why are we learning this".
        furtherReading:
          type: [array, "null"]
          default: null
          items:
            $ref: "#/components/schemas/Reference"
          description: |
            Where to go deeper. Prefers the uploaded course materials — those entries carry a `sourceRef` —
            over outside references.
        differentiation:
          oneOf:
            - $ref: "#/components/schemas/Differentiation"
            - type: "null"
          default: null
          description: Handling the spread in the room — who needs scaffolding, who needs more.
        commonPitfalls:
          type: [array, "null"]
          default: null
          items:
            type: string
            maxLength: 300
          description: |
            Where students go wrong **while solving problems** — procedural slips. Distinct from
            `commonMisconceptions`, which are wrong beliefs about the concept itself.

    Misconception:
      type: object
      required: [misconception, correction]
      properties:
        misconception:
          type: string
          maxLength: 400
          description: The wrong belief, stated the way a student would state it.
          examples: [Amortized O(1) means every append is O(1).]
        correction:
          type: string
          maxLength: 600
          description: What is actually true, and the distinction the student is missing.
        whyItHappens:
          type: [string, "null"]
          maxLength: 400
          default: null
          description: |
            Where the mistake comes from. The most useful field for a teacher — knowing *why* the class
            reaches for the wrong idea is what lets them head it off instead of just contradicting it.

    CheckQuestion:
      type: object
      required: [question, answer]
      properties:
        question:
          type: string
          maxLength: 500
        answer:
          type: string
          maxLength: 800
          description: The expected answer, with enough reasoning that a teacher can mark a near-miss fairly.
        bloomsLevel:
          type: [string, "null"]
          enum: [REMEMBER, UNDERSTAND, APPLY, ANALYZE, EVALUATE, CREATE, null]
          default: null

    KeyTerm:
      type: object
      required: [term, definition]
      properties:
        term:
          type: string
          maxLength: 100
          examples: [Amortized analysis]
        definition:
          type: string
          maxLength: 500
          description: Defined in the sense this subtopic uses, not a dictionary gloss.

    Reference:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 300
        kind:
          type: [string, "null"]
          enum: [BOOK, PAPER, VIDEO, ARTICLE, DOCS, COURSE_MATERIAL, null]
          default: null
        locator:
          type: [string, "null"]
          maxLength: 300
          default: null
          description: How to find it — chapter and section, a URL, a timestamp.
        sourceRef:
          oneOf:
            - $ref: "#/components/schemas/SourceRef"
            - type: "null"
          default: null
          description: Set when the reference is one of the teacher's own uploaded materials.

    Differentiation:
      type: object
      description: How to adjust for the spread of ability in one room.
      properties:
        forStrugglingStudents:
          type: array
          default: []
          items:
            type: string
            maxLength: 300
          description: Scaffolding — what to strip back, which concrete case to start from.
        forAdvancedStudents:
          type: array
          default: []
          items:
            type: string
            maxLength: 300
          description: Extension — where to push, what to prove, which harder case to hand them.

    OutcomeCoverage:
      type: object
      description: |
        One learning outcome from the ancestry, and how far this subtopic's content serves it.

        This is what makes "learning outcomes are the key for the contents" checkable rather than a prompt
        convention: the response states, per subtopic, which outcomes the generated blocks actually
        address. Aggregated across a batch, it shows which outcomes the course still fails to teach.
      required: [level, outcome, coverage]
      properties:
        level:
          type: string
          enum: [MODULE, CHAPTER, LESSON]
          description: Which ancestor carried this outcome. Topics carry none by design.
        outcome:
          type: string
          maxLength: 300
          description: The outcome text, echoed verbatim from `ancestry` so the pairing survives an outline edit.
        coverage:
          type: string
          enum: [FULL, PARTIAL]
          description: |
            `FULL` — a student who works through this subtopic can do what the outcome asks.
            `PARTIAL` — this subtopic contributes, but sibling subtopics are needed to complete it.

            An outcome served by nothing is absent from this array and raises `OUTCOME_NOT_COVERED`.

x-dependencies:
  - id: ingest-contract
    blocking: true
    summary: Document ingest/parse contract does not exist yet.
    detail: >-
      `documentIds` presumes an upload+parse API called during screen 1a. It is what drives the per-file
      "Uploading → Processed / Parsing failed" badges and 1b's "3 files processed" pill. There is also no
      CourseMaterial/Document model in the LMS Prisma schema today. This should be the next contract designed.
  - id: prisma-learning-outcomes
    blocking: true
    summary: learningOutcomes has no column to persist into.
    detail: >-
      Add `learningOutcomes String[] @default([])` to Module, Chapter and Lesson in
      prisma/models/{module,chapter,lesson}.prisma, plus a migration. No such field exists anywhere in the
      schema today.
  - id: lesson-plan-dto
    blocking: true
    summary: CreateLessonPlanDto needs three optional additions to accept this payload.
    detail: >-
      In src/api/course/dto/lessonPlan.dto.ts: add optional logicalId and learningOutcomes to
      CreateModuleDto / CreateChapterDto / CreateLessonDto; add optional logicalId and orderIndex to
      CreateTopicDto and CreateSubTopicDto. Everything else already matches field-for-field.
  - id: lms-job-state
    blocking: false
    summary: The LMS needs somewhere to hold jobId and status.
    detail: >-
      The teacher waits between screens 1b and 1c across page loads, so job state cannot live only in
      browser memory.
  - id: prisma-subtopic-teacher-aids
    blocking: true
    summary: The teacher-facing half of generated content has nowhere to persist.
    detail: >-
      SubTopics already has content String?, examples Json? and image Json?, which cover the three
      student-facing blocks. Nothing exists for teacherAids, outcomeCoverage, sourceRefs, the content
      status or the version number. In prisma/models/sub-topics.prisma add teacherAids Json?,
      contentStatus String @default("PENDING"), contentVersion Int @default(0) and contentMeta Json?
      (holding outcomeCoverage, sourceRefs and readingTimeMinutes), plus a migration. Without
      contentStatus there is no column behind the Pending / Generating / Ready badge that 1c, 1d and 1e
      all render.
  - id: subtopic-content-dto
    blocking: true
    summary: The subtopic DTOs accept most of the payload, but not all of it, and only one row at a time.
    detail: >-
      In src/api/subTopic/dto/create-subTopic.dto.ts, CreateSubTopicDto already takes content, examples
      and image field-for-field; UpdateSubTopicDto is missing image, and neither takes teacherAids,
      logicalId or contentStatus. Add those. Separately, PATCH /sub-topic writes one row per call while a
      1d run finishes up to 50 subtopics - a bulk upsert keyed by logicalId is needed, or the frontend
      will fire 28 sequential writes as the job streams.
  - id: content-version-history
    blocking: false
    summary: 1e shows a version history the schema cannot store.
    detail: >-
      The workbench lists "v3 · current / v2 · AI 14 min ago / v1 · AI 18 min ago" and offers restore.
      ContentItem.version is emitted and increments on every regenerate, but the AI service keeps no
      superseded content - it only numbers versions. Retaining them needs a SubTopicContentVersion model
      on the LMS side.
  - id: content-job-pause
    blocking: false
    summary: 1d says "Pause generation"; the contract only offers cancel.
    detail: >-
      Cancel is terminal - already-READY subtopics survive in the result, but the remaining targets must
      be resubmitted as a new job rather than resumed. Either the button copy becomes "Stop generation",
      or a PAUSED job state plus pause/resume operations get designed. Worth deciding before 1d is built,
      since resume changes the job lifecycle.
  - id: assignment-contract
    blocking: false
    summary: Assignment generation (screens 1m → 1j / 1i) is a separate contract.
    detail: >-
      Note that the Assignment Prisma model currently requires classRoomId, startDate and dueDate, none of
      which exist at outline time.
