                    scope:
                      level: MODULE
                      logicalId: 11111111-1111-4111-8111-111111111111
      responses:
        "202":
          description: |
            Job queued.

            Also returned for a repeat submit carrying a known `Idempotency-Key`, in which case `jobId`
            is the **original** job — no second, billable generation is started.
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAcceptedResponse"
              example:
                status: success
                statusCode: 202
                data:
                  jobId: a91f3c7d-6b28-4e50-9a13-7c4f8b2e0d65
                  status: QUEUED
                  estimatedSeconds: 30
                  pollUrl: /api/v1/course-creation/outline/jobs/a91f3c7d-6b28-4e50-9a13-7c4f8b2e0d65
                  pollAfterMs: 3000
                  expiresAt: "2026-08-18T10:35:00.000Z"
                  createdAt: "2026-08-18T10:30:00.000Z"
                timestamp: "2026-08-18T10:30:00.000Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/DocumentNotFound" }
        "422": { $ref: "#/components/responses/UnprocessableSource" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/course-creation/outline/jobs/{jobId}:
    get:
      operationId: getOutlineJob
      tags: [course-creation]
      summary: Poll a generation job
      description: |
        Returns the current state of a generation job, and the outline itself once the job succeeds.

        ### Polling

        Honour `data.pollAfterMs` from each response rather than a fixed interval. Suggested consumer
        backoff: 3 s for the first 30 s, then 5 s, giving up at the job's `expiresAt`.

        ### Failure handling

        This endpoint returns **`200` for every job state, including `FAILED`** — the transport succeeded,
        the job did not. Inspect `data.status`; when it is `FAILED`, `data.error` carries the same
        `errorCode`/`message`/`details` shape as a transport-level error. Non-2xx from this endpoint means
        the *request* was bad (bad key, unknown job), never that generation failed.

        Terminal jobs (`SUCCEEDED`, `FAILED`, `CANCELLED`) are retained for 1 hour after completion, then
        return `404 JOB_NOT_FOUND`.
      x-timeout-ms: 15000
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Current job state. See `data.status`.
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatusResponse"
              examples:
                running:
                  summary: In progress
                  value:
                    status: success
                    statusCode: 200
                    data:
