                              content: |
                                ## Insertion & Deletion

                                Inserting into or deleting from an array is cheap at the end and expensive
                                anywhere else, and the reason is the same in both directions: elements must
                                stay contiguous.

                                Inserting at index `i` means shifting every element from `i` onward one slot
                                right before the write — n − i moves. Deleting at `i` shifts the tail one
                                slot left to close the hole. Appending and removing at the end move nothing,
                                which is why they are the operations worth designing around.
                              examples:
