                                     *amortized*. The definition should feel like a label for something
                                     they already saw, not a new idea.
                                  4. Close on the "why doubling" question. This is the part that gets
                                     examined and the part they get wrong.

                                  **Do not** let this drift into a proof of the geometric series. The
                                  goal is that they can defend the choice of growth factor, not derive a
                                  bound formally.
                                commonMisconceptions:
                                  - misconception: >-
                                      Amortized O(1) means every append is O(1).
                                    correction: >-
                                      Individual appends can still cost O(n). Amortized analysis bounds
                                      the *total* cost of a sequence, then divides. One append can be
                                      slow; a run of n appends cannot be.
                                    whyItHappens: >-
                                      Students meet Big-O first as a per-operation worst case, so they
                                      read every complexity claim as a per-operation guarantee.
                                  - misconception: >-
                                      Amortized and average-case are the same thing.
                                    correction: >-
                                      Average-case is a claim about random inputs and can be defeated by
                                      unlucky data. Amortized is a worst-case guarantee over a sequence
                                      — no input makes n appends cost more than O(n) in total.
                                    whyItHappens: >-
                                      Both are described informally as "the average cost", and the
                                      distinction only bites when someone constructs an adversarial case.
                                  - misconception: >-
                                      Growing by a fixed amount is fine as long as the chunk is large.
                                    correction: >-
                                      A fixed increment k gives n/k resizes and Θ(n²) total copying. A
                                      bigger k lowers the constant but not the growth rate. Only
                                      multiplicative growth changes the class.
                                    whyItHappens: >-
                                      Growing by 1000 feels dramatically better than growing by 1, and it
                                      is — until n passes 1000 and the quadratic reasserts itself.
                              outcomeCoverage:
                                - level: LESSON
                                  outcome: >-
                                    Perform and analyse core array operations - insert, delete, traverse
                                    and resize
                                  coverage: FULL
                                - level: CHAPTER
                                  outcome: >-
                                    Implement static and dynamic arrays, including resizing and growth
                                    strategies
                                  coverage: PARTIAL
                              sourceRefs:
                                - documentId: d1a4b830-2e75-4f19-b6c3-8a2d5e9f0147
                                  locator: pp. 3-4
                              readingTimeMinutes: 6
                    timestamp: "2026-08-18T10:48:12.000Z"
                partialFailure:
                  summary: Succeeded with one subtopic failed
                  description: >-
                    The common terminal state on a large batch. The **job** succeeded — 27 of 28
                    subtopics have content — and the one failure rides in its own item plus a warning.
                    1d renders that row with a retry action rather than failing the whole run.
                  value:
