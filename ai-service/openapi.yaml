openapi: 3.1.0

info:
  title: A2M8 AI Service
  version: 1.0.0-draft
  summary: AI endpoints backing the LMS course builder.
  description: |
    Contracts between the **college LMS backend** (NestJS + Prisma) and the **AI service** that powers
    the AI-assisted course builder.

    This service is called **server-to-server only**. The browser never talks to it directly — the LMS
    backend holds the API key, resolves documents, and persists results.

    ## Envelopes

    Every response is wrapped. Success:

    ```json
    { "status": "success", "statusCode": 200, "data": { }, "timestamp": "2026-08-18T10:30:00.000Z" }
    ```

    Failure mirrors the LMS backend's own `GlobalExceptionFilter`, with `errorCode` added so consumers
    branch on a stable code instead of matching message strings. `message` is always safe to render in the UI.

    ## Long-running operations

    Anything that can exceed ~10 s is a job, not a blocking request: submit returns `202` with a `jobId`,
    the consumer polls, and may cancel.

    The poll endpoint returns **`200` even when the job FAILED** — the transport succeeded, the job did not.
    The failure rides in `data.error` using the same `errorCode`/`message`/`details` shape as a transport
    error, so consumers keep one error-handling path.

    Consumers honour the server's `pollAfterMs` rather than a hardcoded interval, so the provider can shed
    load without a client change. Terminal jobs are retained for 1 hour, then return `404 JOB_NOT_FOUND`.

    ## Tenancy

    Resources belonging to another tenant resolve as **404, never 403** — otherwise ids can be probed.
  contact:
    name: A2M8 Platform
  x-consumer: college-lms-backend
  x-status: DRAFT
  x-related-repos:
    college-lms-backend: NestJS + Prisma. The consumer. Prisma models in prisma/models/*.prisma.
    college-lms-frontend: React client rendering the course builder screens.
    design: UI mockups. Screens referenced by design id (1a, 1b, 1c...) in x-design-refs.

servers:
  - url: "{AI_SERVICE_BASE_URL}"
    description: Environment-specific base URL, injected by the LMS backend config.
    variables:
      AI_SERVICE_BASE_URL:
        default: https://ai.a2m8.internal

security:
  - ApiKeyAuth: []

tags:
  - name: course-creation
    description: |
      Generating course structure and content from uploaded teaching materials.
      Backs screens 1a → 1b → 1c of the course builder.
  - name: course-content
    description: |
      Writing the teaching content of each SubTopic — explanation, examples, illustration — plus the
      teacher-facing notes that go with it. Backs screens 1c → 1d → 1e.

      Everything here is generated **against the learning outcomes the outline already produced**. The
      outline decides *what* is taught and *what the learner must be able to do*; this tag decides
      *how it is taught*. Nothing is generated for a subtopic whose ancestry carries no outcomes.

paths:
  /api/v1/course-creation/outline/generate:
    post:
      operationId: generateCourseOutline
      tags: [course-creation]
      summary: Queue an outline generation job
      description: |
        Generates a full **Module → Chapter → Lesson → Topic → SubTopic** curriculum outline with learning
        outcomes, from course metadata plus previously ingested course materials.

        Long-running, so it is modelled as an async job: this endpoint queues the work and returns a `jobId`
        immediately. Poll `GET /api/v1/course-creation/outline/jobs/{jobId}` for the result.

        ### Scope

        This contract produces **structure and learning outcomes only**.

        - SubTopic *content* (explanation, examples, figure) is generated separately — see the
          **course-content** tag, which backs screens 1d and 1e and takes the `learningOutcomes` produced
          here as its input. SubTopics come back as `contentStatus: PENDING`.
        - **Assignments are not produced here.** The graded/ungraded assignment rows in 1c render as
          "Not built yet" placeholders and are built via screens 1m → 1j/1i.

        ### Persisting the result

        The `module[]` subtree is deliberately shaped as a near drop-in payload for the LMS backend's existing
        `CreateLessonPlanDto` (`src/api/course/dto/lessonPlan.dto.ts`) — same singular key names
        (`module`, `chapter`, `lesson`, `topic`, `subTopic`) and same field names — so the backend can persist
        via `POST /course/lesson-plan` without a translation layer. Only `logicalId`, `orderIndex`,
        `learningOutcomes`, `sourceRefs` and `contentStatus` are additions.
      x-design-refs:
        - screen: "1a"
          title: Course setup — metadata + materials
          usedFor: Source of the course.* request fields and the documentIds that materials resolve to.
        - screen: "1b"
          title: Build mode selection
          usedFor: >-
            Entry point. "Generate content with AI" submits this job. Copy promises "Outline in ~30s"
            and "Learning outcomes included".
        - screen: "1c"
          title: AI outline review
          usedFor: >-
            Renders the entire response — tree, learning outcome bullets, Outline summary panel,
            Sources used panel.
      x-timeout-ms: 10000
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateOutlineRequest"
            examples:
              typical:
                summary: What screen 1b sends today
                description: >-
                  1b exposes no generation controls, so only the required fields plus light academic
                  steering are sent. Everything under `generation` falls back to service defaults.
                value:
                  courseId: 3f7c2a10-9b41-4c8e-a2d5-6e1f0b3c7d84
                  courseVersionId: 8c1e5d92-47b3-4a6f-9e02-1d5a8f4b6c37
                  course:
                    title: Data Structures & Algorithms
                    courseCode: CS301
                    description: >-
                      Core data structures and algorithm design: arrays, linked lists, trees, graphs,
                      sorting and complexity analysis with weekly labs.
                    type: CLASSROOM
                    versionName: v1
                    designation:
                      id: b7a3f012-5c84-4e91-8d26-3f0a9b1c7e45
                      title: B.Tech CSE - Semester 3
                  documentIds:
                    - d1a4b830-2e75-4f19-b6c3-8a2d5e9f0147
                    - e2b5c941-3f86-4a2b-c7d4-9b3e6f0a1258
                    - f3c6da52-4097-4b3c-d8e5-0c4f7a1b2369
                  generation:
                    academic:
                      durationWeeks: 14
                      difficultyLevel: INTERMEDIATE
                      bloomsLevels: [UNDERSTAND, APPLY, ANALYZE]
                      prerequisiteKnowledge: Programming fundamentals in C or Java
                    sourceFidelity:
                      followSourceOrder: true
                      strictSourceGrounding: false
                  regenerate: null
              minimal:
                summary: Smallest valid request
                description: Only the required fields. All generation behaviour is service-default.
                value:
                  courseId: 3f7c2a10-9b41-4c8e-a2d5-6e1f0b3c7d84
                  courseVersionId: 8c1e5d92-47b3-4a6f-9e02-1d5a8f4b6c37
                  course:
                    title: Data Structures & Algorithms
                    type: CLASSROOM
                  documentIds:
                    - d1a4b830-2e75-4f19-b6c3-8a2d5e9f0147
              regenerate:
                summary: Regenerating, preserving manual edits
                description: >-
                  Backs the "Regenerate outline" button in 1c. Nodes the teacher hand-edited are listed in
                  `lockedLogicalIds` and are echoed back verbatim. A `scope` limits regeneration to one
