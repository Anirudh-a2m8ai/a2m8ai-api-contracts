  /api/v1/course-creation/content/jobs/{jobId}:
    get:
      operationId: getContentJob
      tags: [course-content]
      summary: Poll a content generation job
      description: |
        Returns the current state of a content generation job, and the content produced **so far**.

        ### Results arrive incrementally

        Unlike the outline job, `data.result` is populated from `RUNNING` onward, not only at
        `SUCCEEDED`. Each entry in `result.items[]` carries its own `status`, so a half-finished batch
        is unambiguous — this is what lets 1d promise *"finished subtopics unlock as they're ready"*
        and open a `READY` subtopic in the workbench while its siblings are still generating.

        A consumer that only cares about the finished batch can ignore `result` until
        `data.status` is terminal; the shape does not change.

        ### Partial failure

        One subtopic failing does **not** fail the job. The job reaches `SUCCEEDED` when at least one
        item is `READY`; failed items carry their own `error` and raise a `SUBTOPIC_CONTENT_FAILED`
        warning. `data.status` is `FAILED` only when every item failed or the job itself broke — in
        which case `data.error` is set as usual.

        ### Polling

        Honour `data.pollAfterMs` rather than a fixed interval. A 28-subtopic batch runs for minutes,
        so the server will widen the interval as the queue drains.

        This endpoint returns **`200` for every job state, including `FAILED`**. Terminal jobs are
        retained for 1 hour, then return `404 JOB_NOT_FOUND`.
