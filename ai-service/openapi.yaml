                                  **Open with the surprise, not the definition.** Ask the class what
                                  `append` costs. They will say O(1). Then ask what happens when the
                                  array is full. Let the contradiction sit for a moment before naming it.

                                  **Board plan (≈12 min):**

                                  1. Draw the capacity-1 array and append until it breaks. Do the copy by
