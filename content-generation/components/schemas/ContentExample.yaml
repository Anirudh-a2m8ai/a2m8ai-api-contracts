# Generated by build/split-spec.mjs from the bundled contract.
# Edit this file directly - it is source. Run `npm run build` to re-bundle.
type: object
description: |
  One example card. `kind` decides which optional fields are populated — everything not relevant to
  the kind is `null` or `[]`, never absent, so consumers can render without existence checks.
required:
  - kind
  - title
properties:
  kind:
    $ref: ./ContentExampleKind.yaml
  title:
    type: string
    maxLength: 200
    description: |
      Card label in the 1e carousel. Written to be scannable — the design mock shows
      "Code · push with doubling", "Cost table · n = 1…16", "Worked example · 6 appends".
    examples:
      - Worked example · 6 appends
  explanation:
    type:
      - string
      - "null"
    maxLength: 2000
    default: null
    description: Markdown. Why this example is here and what to notice in it.
  language:
    type:
      - string
      - "null"
    default: null
    description: Language tag for `code`, suitable for a syntax highlighter. `CODE` only.
    examples:
      - python
  code:
    type:
      - string
      - "null"
    maxLength: 4000
    default: null
    description: |
      The snippet, trace or table body, as preformatted text. Populated for `CODE`, `DRY_RUN` and
      `TABLE`. Rendered in the monospace panel in 1e.
  output:
    type:
      - string
      - "null"
    maxLength: 2000
    default: null
    description: What running `code` prints. `CODE` only, and only when the snippet is runnable.
  question:
    type:
      - string
      - "null"
    maxLength: 1000
    default: null
    description: The prompt to the student. `WORKED_PROBLEM`, `QUESTION_ANSWER` and `SCENARIO`.
  steps:
    type: array
    default: []
    items:
      type: string
      maxLength: 500
    description: |
      The solution or trace, one step per entry. `WORKED_PROBLEM` and `DRY_RUN`. Kept as an array,
      not one markdown blob, so a teacher can reveal steps one at a time in class.
  answer:
    type:
      - string
      - "null"
    maxLength: 1000
    default: null
    description: |
      The result the steps arrive at. `WORKED_PROBLEM`, `QUESTION_ANSWER` and `SCENARIO`.
  difficulty:
    type:
      - string
      - "null"
    enum:
      - EASY
      - MEDIUM
      - HARD
      - null
    default: null
x-constraint: |
  Fields populated by kind — everything else is null/[]:
  CODE → language, code, output; WORKED_PROBLEM → question, steps, answer;
  DRY_RUN → code, steps; TABLE → code; QUESTION_ANSWER → question, answer;
  SCENARIO → question, answer; ANALOGY → explanation only.
  `explanation` and `difficulty` are valid on any kind.
