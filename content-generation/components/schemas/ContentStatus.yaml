type: string
description: |
  Content state of a single SubTopic. One field drives the badge on every screen that shows one —
  the `Pending` badge in 1c, the Queued/Generating/Ready badges in 1d, and the Ready pill in 1e.

  | Value | Meaning | Where it shows |
  |---|---|---|
  | `PENDING` | Never requested. The only value the outline contract emits | 1c |
  | `QUEUED` | In this job, not started | 1d |
  | `GENERATING` | Being written now | 1d |
  | `READY` | `content` is populated and openable | 1d, 1e |
  | `FAILED` | Generation failed; `error` is set. Retryable per subtopic | 1d |
  | `CANCELLED` | Abandoned by a cancel before it started | 1d |
enum:
  - PENDING
  - QUEUED
  - GENERATING
  - READY
  - FAILED
  - CANCELLED
