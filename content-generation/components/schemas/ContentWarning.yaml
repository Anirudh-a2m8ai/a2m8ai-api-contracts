# Generated by build/split-spec.mjs from the bundled contract.
# Edit this file directly - it is source. Run `npm run build` to re-bundle.
type: object
description: |
  Non-fatal issue. The job still `SUCCEEDED`; these are advisory and safe to show in 1d.
required:
  - code
  - message
properties:
  code:
    type: string
    description: |
      | Code | Meaning |
      |---|---|
      | `SUBTOPIC_CONTENT_FAILED` | One subtopic failed; the rest of the batch is fine |
      | `IMAGE_OMITTED` | No figure was warranted, or none could be expressed as diagram-as-code |
      | `EXAMPLES_BELOW_TARGET` | Fewer examples than `perSubTopic.min`, rather than padding |
      | `OUTCOME_NOT_COVERED` | A learning outcome in the ancestry that no generated block serves |
      | `SPARSE_SOURCE_COVERAGE` | Thin material for this subtopic; more was written from general knowledge |
      | `TEACHER_AID_OMITTED` | A requested aid had nothing genuine to say for this subtopic |
      | `CONTENT_TRUNCATED` | The explanation hit the length ceiling and was cut |
    enum:
      - SUBTOPIC_CONTENT_FAILED
      - IMAGE_OMITTED
      - EXAMPLES_BELOW_TARGET
      - OUTCOME_NOT_COVERED
      - SPARSE_SOURCE_COVERAGE
      - TEACHER_AID_OMITTED
      - CONTENT_TRUNCATED
  message:
    type: string
    description: Human-readable and safe to render directly in the UI.
  subTopicLogicalId:
    type:
      - string
      - "null"
    format: uuid
    default: null
    description: The subtopic this concerns. `null` for batch-wide warnings.
  documentId:
    type:
      - string
      - "null"
    format: uuid
    default: null
