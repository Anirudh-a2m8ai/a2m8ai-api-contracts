# Generated by build/split-spec.mjs from the bundled contract.
# Edit this file directly - it is source. Run `npm run build` to re-bundle.
type: object
required:
  - courseId
  - courseVersionId
  - outlineId
  - course
  - documentIds
  - targets
properties:
  courseId:
    type: string
    format: uuid
    description: "`Course.id` in the LMS. Echoed for correlation; the AI service does not resolve it."
  courseVersionId:
    type: string
    format: uuid
    description: |
      `CourseVersion.id` the content will be persisted against. Echoed back in the result so the
      result is a complete persist payload on its own.
  outlineId:
    type: string
    format: uuid
    description: |
      `outlineId` of the `OutlineResult` these subtopics came from. Provenance only — the AI service
      does not resolve it, and content generation still works after the outline job has expired.
  course:
    allOf:
      - $ref: ../../../shared/components/schemas/CourseMetadata.yaml
    description: |
      Same object as the outline request. Sets voice, level and scope boundaries for the writing —
      `type: SELF_PACED` in particular pushes the explanation to be self-contained, since there is
      no instructor in the room to fill gaps.
  documentIds:
    type: array
    minItems: 1
    maxItems: 20
    items:
      type: string
      format: uuid
    description: |
      The same processed course materials the outline was generated from. Content is grounded in
      these; `sourceRefs` on the result points back into them.

      **Depends on the document ingest contract, which does not exist yet.**
  targets:
    type: array
    minItems: 1
    maxItems: 50
    items:
      $ref: ./ContentTarget.yaml
    description: |
      The SubTopics to write content for. 1d submits the whole course (28 in the design mock), 1c's
      per-row action and 1e's regenerate submit exactly one.

      Order is not significant — the service may generate in any order, and `items[]` in the result
      is keyed by `subTopicLogicalId`, not by position.
  generation:
    $ref: ./ContentGenerationOptions.yaml
  regenerate:
    oneOf:
      - $ref: ./ContentRegenerateOptions.yaml
      - type: "null"
    default: null
    description: |
      Present only when rewriting content that already exists — the ✦ AI toolkit in 1e. Absent or
      `null` means a first pass.
x-constraint: when `regenerate` is non-null, `targets` must contain exactly one item
