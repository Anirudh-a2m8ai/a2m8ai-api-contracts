# Generated by build/split-spec.mjs from the bundled contract.
# Edit this file directly - it is source. Run `npm run build` to re-bundle.
type: object
description: |
  Drives the 1d progress panel: the bar from `percent`, the label from `message`, and the
  "24 of 28 ready" line from the counts.
required:
  - percent
  - stage
  - message
  - total
  - ready
  - failed
properties:
  percent:
    type: integer
    minimum: 0
    maximum: 100
  stage:
    type: string
    description: |
      Coarsest description of what the job is doing now. On a batch the stages overlap across
      subtopics — this reports the dominant one, not a per-item state.
    enum:
      - PREPARING
      - RESOLVING_SOURCES
      - WRITING_EXPLANATION
      - WRITING_EXAMPLES
      - DESIGNING_IMAGE
      - WRITING_TEACHER_AIDS
      - VALIDATING
  message:
    type: string
    description: Human-readable, safe to surface in the UI. This is 1d's progress label verbatim.
    examples:
      - Generating 12 of 28 subtopics
  total:
    type: integer
    minimum: 0
    description: Number of targets in the job. Equals `targets.length` from the request.
  ready:
    type: integer
    minimum: 0
    description: Items that have reached `READY` and can be opened now.
  failed:
    type: integer
    minimum: 0
