# Generated by build/split-spec.mjs from the bundled contract.
# Edit this file directly - it is source. Run `npm run build` to re-bundle.
type: object
description: |
  One row in screen 1d, and one subtopic's worth of content for screen 1e.
required:
  - subTopicLogicalId
  - title
  - status
properties:
  subTopicLogicalId:
    allOf:
      - $ref: ../../../shared/components/schemas/LogicalId.yaml
    description: Echo of the target. The join key for persisting against the right `SubTopics` row.
  title:
    type: string
    maxLength: 200
    description: Echo of the target title, so 1d can render rows without holding the request.
  breadcrumb:
    type:
      - string
      - "null"
    default: null
    description: |
      Pre-rendered ancestry path, derived from `ancestry`. The grey subtitle under each row in 1d.
      `null` if the service chose not to render one — the consumer can always rebuild it.
    examples:
      - Module 1 · Ch 1.1 · Static & Dynamic Arrays
  status:
    $ref: ./ContentStatus.yaml
  contentId:
    type:
      - string
      - "null"
    format: uuid
    default: null
    description: |
      Identifies this subtopic's generated content. `null` until `READY`. Pass as
      `regenerate.previousContentId` to rewrite it.
  version:
    type:
      - integer
      - "null"
    minimum: 1
    default: null
    description: |
      `1` on first generation, incremented on every regenerate. Backs the "Ready · v3" pill and the
      Version history list in 1e.

      **The AI service does not store superseded versions** — it only numbers them. Keeping the
      history is the LMS's job; see `x-dependencies.content-version-history`.
  generatedAt:
    type:
      - string
      - "null"
    format: date-time
    default: null
  content:
    oneOf:
      - $ref: ./SubTopicContent.yaml
      - type: "null"
    default: null
    description: Populated **only** when `status` is `READY`.
  error:
    oneOf:
      - $ref: ../../../shared/components/schemas/ErrorDetail.yaml
      - type: "null"
    default: null
    description: |
      Populated **only** when `status` is `FAILED`. Same shape as a transport error, so consumers
      keep one error-handling path. Retry by submitting a new job with just this target.
