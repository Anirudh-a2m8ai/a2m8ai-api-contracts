post:
  operationId: generateSubTopicContent
  tags:
    - course-content
  summary: Queue a subtopic content generation job
  description: |
    Writes the teaching content for a batch of SubTopics: an **explanation** in markdown, a set of
    **examples**, and one **illustration**, plus **teacher notes** and **common misconceptions**.

    Long-running, so it is modelled as an async job like the outline. Poll
    `GET /api/v1/course-creation/content/jobs/{jobId}`.

    ### Learning outcomes are the input, not a side note

    Every target carries its `ancestry` — the module, chapter and lesson it sits under, **with the
    `learningOutcomes` the outline generated for each**. Those outcomes are the primary steering
    signal: each generated block must serve at least one of them, nearest level first
    (lesson → chapter → module). The result reports back which outcomes it actually covered in
    `content.outcomeCoverage`, so grounding is auditable rather than assumed.

    A target whose ancestry carries no outcomes at any level is generated on titles alone and
    raises an `OUTCOME_NOT_COVERED` warning.

    ### Stateless

    The AI service holds no outline. Whatever the generation must be aware of travels in the
    request — this is why `ancestry` repeats per target instead of being sent once as a tree. It
    keeps every target independently processable and survives the outline job's 1-hour retention
    window expiring.

    ### Batching

    One job covers 1–50 subtopics. Screen 1d submits the whole course (28 in the design mock);
    screen 1c's per-row action and 1e's regenerate submit exactly one. Partial failure is normal
    and expressible — see the poll endpoint.

    ### Persisting the result

    `content`, `examples` and `image` are named to match the `SubTopics` Prisma columns and the
    existing `POST /sub-topic` / `PATCH /sub-topic` DTOs field-for-field, so a finished item
    persists without a translation layer. `teacherAids` is the one part with nowhere to go today —
    see `x-dependencies`.
  x-design-refs:
    - screen: 1c
      title: AI outline review
      usedFor: The per-row Generate action on a SubTopic row submits a single-target job. Row badges read from `contentStatus`.
    - screen: 1d
      title: Bulk content generation
      usedFor: Entry point for the whole course. Copy promises "Each subtopic gets an explanation, worked examples and a suggested diagram."
    - screen: 1e
      title: SubTopic workbench
      usedFor: The ✦ AI toolkit submits single-target jobs carrying `regenerate` — the quick-action chips map to `regenerate.quickAction`, the prompt box to `regenerate.instruction`.
