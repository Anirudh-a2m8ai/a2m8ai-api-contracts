                              title: Cost by position
                              language: null
                              code: |-
                                position    insert    delete
                                end         O(1)      O(1)
                                middle      O(n)      O(n)
                                front       O(n)      O(n)
                              explanation: Only the end is cheap, and it is cheap for both operations.
