                        content:
                          content: |
                            ## Amortized Resizing

                            A dynamic array has two sizes: the number of elements it currently holds
                            (`size`) and the number of slots it has room for (`capacity`). Appending
                            is cheap — write to `data[size]`, increment `size` — right up until the
                            moment the array is full.

                            ### What happens when it fills up

                            When `size == capacity`, the array cannot grow in place; the memory next
                            to it belongs to something else. So it allocates a **new, larger block**,
                            copies every existing element across, and frees the old one. That single
                            append costs O(n).

                            ### Why the average cost is still O(1)

                            The trick is *how much* larger the new block is. If capacity **doubles**
                            each time, the expensive copies happen at appends 1, 2, 4, 8, 16 … — ever
                            more rarely as the array grows. Summing the copies across n appends:

                            > 1 + 2 + 4 + … + n < 2n

                            Fewer than 2n copies across n appends means **less than 2 copies per
                            append on average**, no matter how large n gets. That average — a cost
                            spread across a run of operations rather than measured on the worst
                            single one — is what *amortized* means.

                            ### Why doubling, specifically

                            Growth must be **multiplicative**. Adding a fixed 10 slots each time
                            gives n/10 resizes and O(n²) total copying — the guarantee collapses.
                            Doubling is the common choice; some libraries use 1.5× to reuse freed
                            memory more readily. Either works. A fixed increment does not.
                          examples:
                            - kind: CODE
                              title: Code · push with doubling
                              language: python
                              code: |-
                                def push(self, x):
                                    if self.size == self.capacity:
                                        self.grow(2 * self.capacity)   # one O(n) copy
                                    self.data[self.size] = x           # usually O(1)
                                    self.size += 1
                              explanation: The whole cost story is in the `if`. It is false for almost every call, which is why the average holds.
                              output: null
                              question: null
                              steps: []
                              answer: null
                              difficulty: EASY
                            - kind: TABLE
                              title: Cost table · n = 1…16
                              language: null
                              code: |-
                                append #   1  2  3  4  5  6  7  8  9 … 16
                                copies     1  2  0  4  0  0  0  8  0 …  0

                                total copies ≤ 2n  →  O(1) amortized
                              explanation: "Read the zeros: 11 of the first 16 appends copy nothing at all. The cost is concentrated in a handful of appends, not spread evenly."
                              output: null
                              question: null
                              steps: []
                              answer: null
                              difficulty: MEDIUM
                            - kind: WORKED_PROBLEM
                              title: Worked example · 6 appends
                              question: Starting from capacity 1, how many element copies happen across six appends with a doubling strategy?
                              steps:
                                - "a1: array is full (cap 1) → grow to 2, copy 1 element"
                                - "a2: full (cap 2) → grow to 4, copy 2 elements"
                                - "a3: fits in the free slot, 0 copies"
                                - "a4: full (cap 4) → grow to 8, copy 4 elements"
                                - "a5, a6: fit, 0 copies"
                              answer: 7 copies across 6 appends — about 1.17 per append, and the ratio keeps falling as n grows.
                              language: null
                              code: null
                              output: null
                              explanation: null
                              difficulty: MEDIUM
                          image:
                            kind: DIAGRAM
                            title: Capacity doubling 1→2→4→8
                            caption: Each grow copies every element once — total copies across n appends stay ≤ 2n, so the amortized cost per append is O(1).
                            altText: Four rows of array slots of capacity 1, 2, 4 and 8. Each row marks the newly appended element, the elements copied during the grow, and the free slots left over, with the copy count falling relative to capacity.
                            prompt: 'A clean four-row educational diagram of a dynamic array growing. Row 1: one slot, capacity 1, one filled cell labelled "append 1". Row 2: two slots, capacity 2, labelled "grow · 1 copy". Row 3: four slots, capacity 4, labelled "grow · 2 copies". Row 4: eight slots, capacity 8, labelled "grow · 4 copies". Use three cell fills — new element, copied on grow, free slot — with a small legend. Flat vector style, no shadows, restrained palette, generous whitespace.'
