                                  D --> E["total copies ≤ 2n<br/>→ O(1) amortized"]
                          teacherAids:
                            teacherNotes: |
                              **Open with the surprise, not the definition.** Ask the class what
                              `append` costs. They will say O(1). Then ask what happens when the
                              array is full. Let the contradiction sit for a moment before naming it.

                              **Board plan (≈12 min):**

                              1. Draw the capacity-1 array and append until it breaks. Do the copy by
                                 hand on the board — the physical act of rewriting elements is what
                                 makes the cost real.
                              2. Build the copy table (appends 1–16) *with* the class. Let them spot
                                 the run of zeros themselves.
                              3. Only now write `1 + 2 + 4 + … + n < 2n` and say the word
                                 *amortized*. The definition should feel like a label for something
                                 they already saw, not a new idea.
                              4. Close on the "why doubling" question. This is the part that gets
                                 examined and the part they get wrong.

                              **Do not** let this drift into a proof of the geometric series. The
                              goal is that they can defend the choice of growth factor, not derive a
                              bound formally.
                            commonMisconceptions:
                              - misconception: Amortized O(1) means every append is O(1).
                                correction: Individual appends can still cost O(n). Amortized analysis bounds the *total* cost of a sequence, then divides. One append can be slow; a run of n appends cannot be.
                                whyItHappens: Students meet Big-O first as a per-operation worst case, so they read every complexity claim as a per-operation guarantee.
                              - misconception: Amortized and average-case are the same thing.
                                correction: Average-case is a claim about random inputs and can be defeated by unlucky data. Amortized is a worst-case guarantee over a sequence — no input makes n appends cost more than O(n) in total.
                                whyItHappens: Both are described informally as "the average cost", and the distinction only bites when someone constructs an adversarial case.
                              - misconception: Growing by a fixed amount is fine as long as the chunk is large.
                                correction: A fixed increment k gives n/k resizes and Θ(n²) total copying. A bigger k lowers the constant but not the growth rate. Only multiplicative growth changes the class.
                                whyItHappens: Growing by 1000 feels dramatically better than growing by 1, and it is — until n passes 1000 and the quadratic reasserts itself.
