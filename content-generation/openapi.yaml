tags:
  - name: course-content
    description: |
      Writing the teaching content of each SubTopic — explanation, examples, illustration — plus the
      teacher-facing notes that go with it. Backs screens 1c → 1d → 1e.

      Everything here is generated **against the learning outcomes the outline already produced**. The
      outline decides *what* is taught and *what the learner must be able to do*; this tag decides
      *how it is taught*. Nothing is generated for a subtopic whose ancestry carries no outcomes.
