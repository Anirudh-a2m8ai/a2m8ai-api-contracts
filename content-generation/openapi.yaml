openapi: 3.1.0
info:
  title: A2M8 AI Service — Content Generation
  version: 1.0.0-draft
  summary: Content generation endpoints backing the LMS course builder.
  description: |
    Contracts between the **college LMS backend** (NestJS + Prisma) and the **AI service** that powers
    the AI-assisted course builder.

    This service is called **server-to-server only**. The browser never talks to it directly — the LMS
    backend holds the API key, resolves documents, and persists results.

    ## Envelopes

    Every response is wrapped. Success:

    ```json
    { "statusCode": 200, "code": "LMS200", "success": true, "message": "Operation completed successfully", "data": { }, "meta": null, "error": null }
    ```

    Failure mirrors the LMS backend's own `GlobalExceptionFilter`. `code` is always `LMS` followed by
    `statusCode` (e.g. `LMS400`) — it never varies independently of the status. Branch on
    `error.name`, a stable machine-readable code, not on `message` text — `message` stays generic
    across every occurrence of the same `error.name`, while `error.details` is specific to this one.
    `error.fieldErrors` (`field`/`message` pairs) is present for request-validation failures. Both
    `message` and `error.details` are always safe to render directly in the UI.

    ## Long-running operations

    Anything that can exceed ~10 s is a job, not a blocking request: submit returns `202` with a `jobId`,
    the consumer polls, and may cancel.

    The poll endpoint returns **`200` even when the job FAILED** — the transport succeeded, the job did not.
    The failure rides in `data.error`, using the same `ErrorDetail` shape (`name`/`details`/`fieldErrors`)
    as a transport-level error's `error` object, so consumers keep one error-handling path.

    Consumers honour the server's `pollAfterMs` rather than a hardcoded interval, so the provider can shed
    load without a client change. Terminal jobs are retained for 1 hour, then return `404 JOB_NOT_FOUND`.

    ## Tenancy

    Resources belonging to another tenant resolve as **404, never 403** — otherwise ids can be probed.
