x-dependencies:
  - id: lms-job-state
    blocking: false
    summary: The LMS needs somewhere to hold jobId and status.
    detail: The teacher waits between screens 1b and 1c across page loads, so job state cannot live only in browser memory.
  - id: prisma-subtopic-teacher-aids
    blocking: true
    summary: The teacher-facing half of generated content has nowhere to persist.
    detail: SubTopics already has content String?, examples Json? and image Json?, which cover the three student-facing blocks. Nothing exists for teacherAids, outcomeCoverage, sourceRefs, the content status or the version number. In prisma/models/sub-topics.prisma add teacherAids Json?, contentStatus String @default("PENDING"), contentVersion Int @default(0) and contentMeta Json? (holding outcomeCoverage, sourceRefs and readingTimeMinutes), plus a migration. Without contentStatus there is no column behind the Pending / Generating / Ready badge that 1c, 1d and 1e all render.
  - id: subtopic-content-dto
    blocking: true
    summary: The subtopic DTOs accept most of the payload, but not all of it, and only one row at a time.
    detail: In src/api/subTopic/dto/create-subTopic.dto.ts, CreateSubTopicDto already takes content, examples and image field-for-field; UpdateSubTopicDto is missing image, and neither takes teacherAids, logicalId or contentStatus. Add those. Separately, PATCH /sub-topic writes one row per call while a 1d run finishes up to 50 subtopics - a bulk upsert keyed by logicalId is needed, or the frontend will fire 28 sequential writes as the job streams.
  - id: content-version-history
    blocking: false
    summary: 1e shows a version history the schema cannot store.
    detail: The workbench lists "v3 · current / v2 · AI 14 min ago / v1 · AI 18 min ago" and offers restore. ContentItem.version is emitted and increments on every regenerate, but the AI service keeps no superseded content - it only numbers versions. Retaining them needs a SubTopicContentVersion model on the LMS side.
  - id: content-job-pause
    blocking: false
    summary: 1d says "Pause generation"; the contract only offers cancel.
    detail: Cancel is terminal - already-READY subtopics survive in the result, but the remaining targets must be resubmitted as a new job rather than resumed. Either the button copy becomes "Stop generation", or a PAUSED job state plus pause/resume operations get designed. Worth deciding before 1d is built, since resume changes the job lifecycle.
