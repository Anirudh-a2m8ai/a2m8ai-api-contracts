# Generated by a one-time migration split of the combined ai-service contract.
# Edit this file directly - it is source. Run `npm run build` to re-bundle shared/components/schemas.
type: string
format: uuid
description: |
  Stable identity for this node, generated by the AI service.

  The frontend keys tree rows by it and tracks manual edits against it; the consumer persists it into
  the `logicalId` column that **already exists** on `Module`, `Chapter`, `Lesson`, `Topics` and
  `SubTopics`.

  On regenerate, nodes listed in `regenerate.lockedLogicalIds` are echoed back with the same
  `logicalId` — this is what makes *"Regenerating keeps your manual edits"* work.
