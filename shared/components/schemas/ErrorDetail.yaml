type: object
description: |
  The `error` object on every failure — both an `ErrorResponse`'s own `error` and a terminal job's
  `data.error` use this same shape, so consumers keep one error-handling path regardless of which
  one they're looking at.
required:
  - name
  - details
properties:
  name:
    $ref: ./ErrorCode.yaml
  details:
    type: string
    description: |
      Human-readable and specific to this occurrence — more precise than the envelope's own
      `message`, which stays generic enough to be identical across every instance of the same
      `name`. Always safe to render directly in the UI.
  fieldErrors:
    type: array
    description: Present for request-validation failures (`name` is field-shaped, e.g. `MISSING_REQUIRED_FIELD` or `INVALID_REQUEST`); absent otherwise.
    items:
      $ref: ./FieldError.yaml
