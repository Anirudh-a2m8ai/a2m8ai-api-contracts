# Generated by a one-time migration split of the combined ai-service contract.
# Edit this file directly - it is source. Run `npm run build` to re-bundle shared/components/schemas.
type: string
description: |
  Stable machine-readable failure code.

  | Code | HTTP | Retryable |
  |---|---|---|
  | `INVALID_REQUEST` | 400 | no |
  | `MISSING_REQUIRED_FIELD` | 400 | no |
  | `INVALID_API_KEY` | 401 | no |
  | `DOCUMENT_NOT_FOUND` | 404 | no |
  | `JOB_NOT_FOUND` | 404 | no |
  | `CONTENT_NOT_FOUND` | 404 | no |
  | `JOB_ALREADY_TERMINAL` | 409 | no |
  | `DOCUMENT_NOT_PROCESSED` | 422 | yes — once ingest finishes |
  | `INSUFFICIENT_SOURCE_MATERIAL` | 422 | no |
  | `RATE_LIMITED` | 429 | yes |
  | `QUOTA_EXCEEDED` | 429 | no |
  | `MODEL_ERROR` | job-level | yes |
  | `SERVICE_UNAVAILABLE` | 503 | yes |
  | `GENERATION_TIMEOUT` | job-level | yes |

  `MODEL_ERROR` and `GENERATION_TIMEOUT` surface as terminal **job** errors on the poll endpoint
  (HTTP 200, `data.status: FAILED`), never as a transport status on submit.

  `MISSING_REQUIRED_FIELD` is the specific case of a required field being absent or empty —
  `error.fieldErrors` names exactly which one. `INVALID_REQUEST` covers every other 400 validation
  failure (wrong type, out-of-range count, cross-field constraint, ...), and may also carry
  `fieldErrors` when the violation is field-shaped.
enum:
  - INVALID_REQUEST
  - MISSING_REQUIRED_FIELD
  - INVALID_API_KEY
  - DOCUMENT_NOT_FOUND
  - JOB_NOT_FOUND
  - CONTENT_NOT_FOUND
  - JOB_ALREADY_TERMINAL
  - DOCUMENT_NOT_PROCESSED
  - INSUFFICIENT_SOURCE_MATERIAL
  - RATE_LIMITED
  - QUOTA_EXCEEDED
  - MODEL_ERROR
  - SERVICE_UNAVAILABLE
  - GENERATION_TIMEOUT
