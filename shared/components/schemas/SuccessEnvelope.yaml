type: object
description: Common wrapper on every 2xx response.
required:
  - statusCode
  - code
  - success
  - message
  - data
  - meta
  - error
properties:
  statusCode:
    type: integer
    examples:
      - 200
  code:
    type: string
    description: "Always `LMS` followed by `statusCode` — e.g. `200` produces `LMS200`. Not an independent value: two responses with the same `statusCode` always share the same `code`."
