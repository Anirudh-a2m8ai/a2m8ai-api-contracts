      - LMS200
  success:
    type: boolean
    const: true
  message:
    type: string
    description: Human-readable and always safe to render directly in the UI.
  meta:
    type: "null"
    description: Reserved for future use (e.g. pagination). Always `null` today.
  error:
    type: "null"
    const: null
