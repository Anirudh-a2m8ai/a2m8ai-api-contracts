# Generated by a one-time migration split of the combined ai-service contract.
# Edit this file directly - it is source. Run `npm run build` to re-bundle shared/components/schemas.
type: object
description: |
  Common wrapper on every non-2xx response. Mirrors the LMS backend's `GlobalExceptionFilter`
  (`src/common/filters/global-exception.filter.ts`), with the structured `error` object added so
  consumers branch on a stable `error.name` rather than matching message strings.
required:
  - statusCode
  - code
  - success
  - message
  - data
  - meta
  - error
properties:
  statusCode:
    type: integer
  code:
    type: string
    description: "Always `LMS` followed by `statusCode` — e.g. `400` produces `LMS400`. Not an independent value: two responses with the same `statusCode` always share the same `code`."
    examples:
      - LMS400
  success:
    type: boolean
    const: false
  message:
    type: string
    description: |
      Human-readable and always safe to render directly in the UI. Generic to `error.name` — the
      same wording for every occurrence of that error, regardless of which field or job triggered
      it. See `error.details` for the specific occurrence.
  data:
    type: "null"
    const: null
  meta:
    type: "null"
    description: Reserved for future use (e.g. pagination). Always `null` today.
  error:
    $ref: ./ErrorDetail.yaml
